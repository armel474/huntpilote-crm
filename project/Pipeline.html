*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

[data-theme="dark"] {

.search-wrap { position: relative; display: flex; align-items: center; }

.tab.on { background: var(--bg-solid); color: var(--fg1); box-shadow: 0 1px 4px rgba(0,0,0,0.09); }
.lbl { font-size: 0.5625rem; font-weight: 700; color: var(--fg4); text-transform: uppercase; letter-spacing: 0.07em; }
.sc { overflow-y: auto; }
.sc::-webkit-scrollbar { width: 7px; height: 7px; }
.sc::-webkit-scrollbar-thumb { background: var(--bd-strong); border-radius: 999px; }
.sc::-webkit-scrollbar-track { background: transparent; }

.deal-card { cursor: grab; transition: box-shadow 160ms, transform 160ms, border-color 160ms; }

.col-body.over { background: var(--bg-muted); outline: 2px dashed var(--bd-strong); outline-offset: -3px; }

        <input className="search-inp" placeholder="Rechercher…" value={s} onChange={(e) => setS(e.target.value)} />
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '0.325rem 0.7rem', borderRadius: 999, border: '1px solid var(--bd-solid)', background: 'var(--bg-solid)', fontSize: '0.75rem', fontWeight: 500, color: 'var(--fg2)', cursor: 'pointer', whiteSpace: 'nowrap' }}>
        Ce trimestre <I.Chev />
      </div>
      <button className="btn-icon"><I.Bell /><span style={{ position: 'absolute', top: 3, right: 3, width: 6, height: 6, background: 'var(--red)', borderRadius: '50%', border: '1.5px solid var(--bg-base)' }}></span></button>
      <button className="btn-icon" onClick={onToggleTheme} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <I.Sun /> : <I.Moon />}</button>
      <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MC</div>
      <button className="btn-icon"><I.Cog /></button>
    </div>
  );
};

/* ── STAT STRIP ── */
const StatStrip = ({ deals }) => {
  const active = deals.filter((d) => d.stage !== 'gagne');
  const totalMrr = active.reduce((s, d) => s + d.mrr, 0);
  const weighted = Math.round(deals.reduce((s, d) => s + d.mrr * d.prob / 100, 0));
  const won = deals.filter((d) => d.stage === 'gagne');
  const wonMrr = won.reduce((s, d) => s + d.mrr, 0);
  const stats = [
    { l: 'Pipeline actif', v: `${fmt(totalMrr)} $`, sub: `${active.length} opportunités · MRR/mois`, c: 'var(--fg1)' },
    { l: 'Prévision pondérée', v: `${fmt(weighted)} $`, sub: 'MRR ajusté par probabilité', c: 'var(--blue-fg)' },
    { l: 'Gagné ce trimestre', v: `${fmt(wonMrr)} $`, sub: `${won.length} nouveaux clients`, c: 'var(--green)' },
    { l: 'Taux de conversion', v: '28%', sub: '+4 pts vs T1', c: 'var(--fg1)' },
    { l: 'Cycle de vente moyen', v: '34 j', sub: 'Prospect → signature', c: 'var(--fg1)' },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5,1fr)', gap: 8, padding: '0.875rem 1.125rem 0' }}>
      {stats.map((s) =>
        <div key={s.l} className="card" style={{ padding: '0.75rem 0.875rem' }}>
          <div className="lbl" style={{ marginBottom: 5 }}>{s.l}</div>
          <div style={{ fontSize: '1.25rem', fontWeight: 800, color: s.c, letterSpacing: '-0.03em', lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>{s.v}</div>
          <div style={{ fontSize: '0.5625rem', color: 'var(--fg4)', marginTop: 5 }}>{s.sub}</div>
        </div>
      )}
    </div>
  );
};

/* ── DEAL CARD ── */
const DealCard = ({ deal, dragging, onDragStart, onDragEnd }) => {
  const o = OWNERS[deal.owner];
  const probColor = deal.prob >= 75 ? 'var(--green)' : deal.prob >= 45 ? 'var(--yellow-fg)' : deal.prob >= 25 ? 'var(--blue-fg)' : 'var(--fg4)';
  const hot = deal.prob >= 70;
  return (
    <div className={`card deal-card${dragging ? ' dragging' : ''}`} draggable
      onDragStart={(e) => onDragStart(e, deal.id)} onDragEnd={onDragEnd}
      style={{ padding: '0.75rem', borderRadius: 11 }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8, marginBottom: 9 }}>
        <div style={{ width: 30, height: 30, borderRadius: 8, flexShrink: 0, background: 'linear-gradient(140deg,var(--bg-muted),var(--bg-base))', border: '1px solid var(--bd-solid)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.6875rem', fontWeight: 800, color: 'var(--fg2)' }}>
          {deal.company.split(' ').slice(0, 2).map((w) => w[0]).join('')}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: '0.8125rem', fontWeight: 700, color: 'var(--fg1)', lineHeight: 1.15, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{deal.company}</div>
          <div style={{ fontSize: '0.5625rem', color: 'var(--fg4)', marginTop: 2 }}>{deal.sector}</div>
        </div>
        {hot && <span title="Opportunité chaude" style={{ color: 'var(--red)', flexShrink: 0 }}><I.Flame /></span>}
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, marginBottom: 9 }}>
        <span style={{ fontSize: '1rem', fontWeight: 800, color: 'var(--fg1)', letterSpacing: '-0.02em', fontVariantNumeric: 'tabular-nums' }}>{fmt(deal.mrr)} $</span>
        <span style={{ fontSize: '0.625rem', color: 'var(--fg4)', fontWeight: 500 }}>/mois</span>
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginBottom: 10 }}>
        {deal.services.map((s) => <span key={s} style={{ fontSize: '0.5rem', fontWeight: 600, padding: '2px 7px', borderRadius: 999, background: 'var(--bg-muted)', color: 'var(--fg2)', border: '1px solid var(--bd-solid)' }}>{s}</span>)}
      </div>
      <div style={{ height: 1, background: 'var(--bd)', marginBottom: 9 }}></div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
        <div title={o.name} style={{ width: 20, height: 20, borderRadius: '50%', background: o.c, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.5rem', fontWeight: 800, flexShrink: 0 }}>{deal.owner}</div>
        <span style={{ display: 'flex', alignItems: 'center', gap: 3, fontSize: '0.5625rem', color: 'var(--fg4)' }}><I.Clock />{deal.days} j</span>
        <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 4 }}>
          <span style={{ fontSize: '0.625rem', fontWeight: 800, color: probColor, fontVariantNumeric: 'tabular-nums' }}>{deal.prob}%</span>
        </span>
      </div>
    </div>
  );
};

/* ── BOARD ── */
const Board = ({ deals, setDeals }) => {
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; };
  const onDragEnd = () => { setDragId(null); setOverCol(null); };
  const onDrop = (stageId) => {
    if (dragId == null) return;
    setDeals((prev) => prev.map((d) => d.id === dragId ? { ...d, stage: stageId, days: d.stage === stageId ? d.days : 0, prob: d.stage === stageId ? d.prob : ({ prospect: 15, qualifie: 38, proposition: 55, negociation: 78, gagne: 100 }[stageId]) } : d));
    setDragId(null); setOverCol(null);
  };
  return (
    <div className="sc" style={{ flex: 1, overflowX: 'auto', overflowY: 'hidden', padding: '0.875rem 1.125rem 1.125rem' }}>
      <div style={{ display: 'flex', gap: 12, height: '100%', minWidth: 'min-content' }}>
        {STAGES.map((st) => {
          const cards = deals.filter((d) => d.stage === st.id);
          const sum = cards.reduce((s, d) => s + d.mrr, 0);
          return (
            <div key={st.id} style={{ width: 244, flexShrink: 0, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '0 4px 9px' }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: st.accent, flexShrink: 0 }}></span>
                <span style={{ fontSize: '0.75rem', fontWeight: 800, color: 'var(--fg1)' }}>{st.label}</span>
                <span style={{ fontSize: '0.5625rem', fontWeight: 800, color: 'var(--fg3)', background: 'var(--bg-muted)', borderRadius: 999, padding: '1px 7px' }}>{cards.length}</span>
                <span style={{ marginLeft: 'auto', fontSize: '0.625rem', fontWeight: 700, color: 'var(--fg3)', fontVariantNumeric: 'tabular-nums' }}>{fmt(sum)} $</span>
              </div>
              <div style={{ height: 2, background: st.accent, opacity: 0.35, borderRadius: 999, marginBottom: 9 }}></div>
              <div className={`col-body sc${overCol === st.id ? ' over' : ''}`}
                onDragOver={(e) => { e.preventDefault(); setOverCol(st.id); }}
                onDragLeave={(e) => { if (e.currentTarget === e.target) setOverCol(null); }}
                onDrop={() => onDrop(st.id)}
                style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 8, padding: 4, borderRadius: 12, transition: 'background 140ms' }}>
                {cards.map((d) => <DealCard key={d.id} deal={d} dragging={dragId === d.id} onDragStart={onDragStart} onDragEnd={onDragEnd} />)}
                <button style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5, padding: '0.5rem', borderRadius: 10, border: '1px dashed var(--bd-strong)', background: 'transparent', color: 'var(--fg4)', fontFamily: 'var(--font)', fontSize: '0.625rem', fontWeight: 600, cursor: 'pointer', flexShrink: 0 }}>
                  <I.Plus />Ajouter
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ── APP ── */
const App = () => {
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('hp-theme') || 'light'; } catch { return 'light'; } });
  const [deals, setDeals] = useState(DEALS0);
  const [view, setView] = useState('kanban');
  useEffect(() => {
    const h = document.documentElement;
    h.setAttribute('data-theme-switching', '');
    h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500);
    return () => clearTimeout(t);
  }, [theme]);
  const toggleTheme = () => setTheme((t) => t === 'dark' ? 'light' : 'dark');

  const active = deals.filter((d) => d.stage !== 'gagne');
  const totalMrr = active.reduce((s, d) => s + d.mrr, 0);

  return (
    <div className="app-shell">
      <NavSidebar active="pipeline" />
      <div className="main">
        <CRMHeader theme={theme} onToggleTheme={toggleTheme}
          title="Pipeline commercial"
          sub={`${active.length} opportunités actives · ${fmt(totalMrr)} $ de MRR potentiel`} />

        {/* Toolbar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '0.75rem 1.125rem', borderBottom: '1px solid var(--bd-solid)', background: 'rgba(255,255,255,0.6)', backdropFilter: 'var(--blur)', flexShrink: 0 }}>
          <div style={{ display: 'flex', gap: 4, padding: 3, borderRadius: 999, background: 'var(--bg-muted)' }}>
            <button className={`tab${view === 'kanban' ? ' on' : ''}`} onClick={() => setView('kanban')} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '0.3rem 0.7rem' }}><I.Grid />Kanban</button>
            <button className={`tab${view === 'liste' ? ' on' : ''}`} onClick={() => setView('liste')} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '0.3rem 0.7rem' }}><I.List />Liste</button>
          </div>
          <button className="btn-out" style={{ padding: '0.4rem 0.75rem' }}><I.Filter />Filtres</button>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginLeft: 4 }}>
            <span className="lbl">Équipe</span>
            <div style={{ display: 'flex' }}>
              {Object.entries(OWNERS).map(([k, o], i) => <div key={k} title={o.name} style={{ width: 22, height: 22, borderRadius: '50%', background: o.c, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.5rem', fontWeight: 800, border: '2px solid var(--bg-base)', marginLeft: i ? -7 : 0 }}>{k}</div>)}
            </div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: '0.625rem', color: 'var(--fg4)', display: 'flex', alignItems: 'center', gap: 4 }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 9l-3 3 3 3" /><path d="M9 5l3-3 3 3" /><path d="M15 19l-3 3-3-3" /><path d="M19 9l3 3-3 3" /><path d="M2 12h20" /><path d="M12 2v20" /></svg>
              Glissez les cartes entre les étapes
            </span>
            <button className="btn-pri" onClick={() => window.location.href = 'Onboarding.html'}><I.Plus />Nouveau prospect</button>
          </div>
        </div>

        <StatStrip deals={deals} />

        {view === 'kanban'
          ? <Board deals={deals} setDeals={setDeals} />
          : <div className="sc" style={{ flex: 1, overflowY: 'auto', padding: '1rem 1.125rem' }}>
              <ListView deals={deals} />
            </div>}
      </div>
    </div>
  );
};

/* ── LIST VIEW ── */
const ListView = ({ deals }) => {
  const stageMap = Object.fromEntries(STAGES.map((s) => [s.id, s]));
  const ordered = [...deals].sort((a, b) => STAGES.findIndex((s) => s.id === a.stage) - STAGES.findIndex((s) => s.id === b.stage) || b.mrr - a.mrr);
  return (
    <div className="card" style={{ padding: '0.5rem 1rem 0.875rem' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr 1fr 0.8fr 0.7fr 0.7fr', gap: '0 12px', alignItems: 'center' }}>
        {['Entreprise', 'Étape', 'Services', 'MRR/mois', 'Resp.', 'Prob.'].map((h) => <div key={h} className="lbl" style={{ padding: '8px 0', borderBottom: '1px solid var(--bd-solid)' }}>{h}</div>)}
        {ordered.map((d) => {
          const st = stageMap[d.stage];
          const o = OWNERS[d.owner];
          const probColor = d.prob >= 75 ? 'var(--green)' : d.prob >= 45 ? 'var(--yellow-fg)' : d.prob >= 25 ? 'var(--blue-fg)' : 'var(--fg4)';
          return (
            <React.Fragment key={d.id}>
              <div style={{ padding: '11px 0', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', gap: 9 }}>
                <div style={{ width: 26, height: 26, borderRadius: 7, flexShrink: 0, background: 'linear-gradient(140deg,var(--bg-muted),var(--bg-base))', border: '1px solid var(--bd-solid)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.5625rem', fontWeight: 800, color: 'var(--fg2)' }}>{d.company.split(' ').slice(0, 2).map((w) => w[0]).join('')}</div>
                <div><div style={{ fontSize: '0.75rem', fontWeight: 700 }}>{d.company}</div><div style={{ fontSize: '0.5625rem', color: 'var(--fg4)' }}>{d.sector}</div></div>
              </div>
              <div style={{ padding: '11px 0', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: st.accent }}></span>
                <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--fg2)' }}>{st.label}</span>
              </div>
              <div style={{ padding: '11px 0', borderBottom: '1px solid var(--bd)', display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                {d.services.map((s) => <span key={s} style={{ fontSize: '0.5rem', fontWeight: 600, padding: '2px 6px', borderRadius: 999, background: 'var(--bg-muted)', color: 'var(--fg2)', border: '1px solid var(--bd-solid)' }}>{s}</span>)}
              </div>
              <div style={{ padding: '11px 0', borderBottom: '1px solid var(--bd)', fontSize: '0.8125rem', fontWeight: 800, fontVariantNumeric: 'tabular-nums' }}>{fmt(d.mrr)} $</div>
              <div style={{ padding: '11px 0', borderBottom: '1px solid var(--bd)' }}>
                <div title={o.name} style={{ width: 22, height: 22, borderRadius: '50%', background: o.c, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.5rem', fontWeight: 800 }}>{d.owner}</div>
              </div>
              <div style={{ padding: '11px 0', borderBottom: '1px solid var(--bd)', fontSize: '0.75rem', fontWeight: 800, color: probColor, fontVariantNumeric: 'tabular-nums' }}>{d.prob}%</div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
