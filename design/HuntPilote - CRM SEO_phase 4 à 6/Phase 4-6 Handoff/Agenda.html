.ag-cell.is-today{border-color:var(--green-b);box-shadow:inset 0 0 0 1px var(--green-b)}

.ag-cell.drop-on{border-color:var(--blue-b);box-shadow:inset 0 0 0 2px var(--blue-b)}

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { NavSidebar } = window;
const { AI, AgLegend, RecapLine, WeekView, MonthView, DayPanel, NewRdvModal, conflictSet, weekDays, monthGrid, addDays, fmtLong, fmtDM, parseD, M_LONG } = window;

const I = {
  Srch: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>,
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};

const CRMHeader = ({ theme, onToggleTheme }) => {
  const [s, setS] = useState('');
  return (
    <div className="crm-header">
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1 }}>Agenda</div>
        <div className="crumb"><a href="Dashboard.html">Accueil</a><span>›</span><b>Agenda</b></div>
      </div>
      <div className="search-wrap"><span className="search-ico"><I.Srch /></span><input className="search-inp" placeholder="Rechercher…" value={s} onChange={e => setS(e.target.value)} /></div>
      <button className="btn-icon" title="Notifications"><I.Bell /><span style={{ position: 'absolute', top: 3, right: 3, width: 6, height: 6, background: 'var(--red)', borderRadius: '50%', border: '1.5px solid var(--bg-base)' }}></span></button>
      <button className="btn-icon" onClick={onToggleTheme} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <I.Sun /> : <I.Moon />}</button>
      <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MC</div>
    </div>);
};

const SCENARIOS = [['normal', 'Vue normale'], ['chargee', 'Semaine chargée'], ['depassee', 'Échéances dépassées'], ['conflit', 'Conflit de rendez-vous'], ['creuse', 'Journée vide']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [scenario, setScenario] = useState(() => { try { return localStorage.getItem('hp-ag-scenario') || 'normal'; } catch { return 'normal'; } });
  const [view, setView] = useState(() => { try { return localStorage.getItem('hp-ag-view') || 'semaine'; } catch { return 'semaine'; } });
  const [weekStart, setWeekStart] = useState('2026-09-07');
  const [ym, setYm] = useState('2026-09');
  const [selected, setSelected] = useState(window.AG_TODAY);
  const [moved, setMoved] = useState({});
  const [created, setCreated] = useState([]);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const on = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', on); return () => mq.removeEventListener('change', on);
  }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 5200); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { try { localStorage.setItem('hp-ag-view', view); } catch {} }, [view]);

  const setSc = s => { setScenario(s); setMoved({}); setCreated([]); setSelected(s === 'creuse' ? window.AG_TODAY : window.AG_TODAY); setWeekStart('2026-09-07'); setYm('2026-09'); try { localStorage.setItem('hp-ag-scenario', s); } catch {} };

  const evs = useMemo(() => window.agScenario(scenario).map(e => moved[e.id] ? { ...e, date: moved[e.id] } : e).concat(created), [scenario, moved, created]);
  const conflicts = useMemo(() => conflictSet(evs), [evs]);
  const range = view === 'semaine' ? weekDays(weekStart) : monthGrid(ym).filter(d => Number(d.split('-')[1]) === Number(ym.split('-')[1]));
  const rangeLabel = view === 'semaine'
    ? `Semaine du ${parseD(weekStart).getDate()} au ${fmtDM(addDays(weekStart, 6))}`
    : `${M_LONG[Number(ym.split('-')[1]) - 1].replace(/^./, c => c.toUpperCase())} ${ym.split('-')[0]}`;

  const onMove = (id, date) => {
    if (!id || !date) return;
    const ev = evs.find(x => x.id === id);
    if (!ev || ev.date === date || !window.AG_TYPES[ev.type].movable) return;
    setMoved(m => ({ ...m, [id]: date }));
    setSelected(date);
    setToast(`Échéance déplacée au ${fmtLong(date)} — ${ev.ref ? `la ${ev.ref}` : 'la tâche liée'} a été mise à jour dans le plan d’action.`);
  };
  const onCreate = f => {
    const id = `N${created.length + 1}`;
    setCreated(c => [...c, { id, type: 'rdv', date: f.date, time: f.time, dur: f.dur, title: f.title.trim(), client: f.client }]);
    setSelected(f.date); setModal(null);
    setToast(`Rendez-vous créé le ${fmtLong(f.date)} avec ${window.AG_CLIENTS[f.client].replace(/\.$/, '')}.`);
  };
  const shift = n => view === 'semaine' ? setWeekStart(w => addDays(w, 7 * n)) : setYm(v => { const [y, m] = v.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
  const goToday = () => { setWeekStart('2026-09-07'); setYm('2026-09'); setSelected(window.AG_TODAY); };

  return (
    <div className="app-shell">
      <NavSidebar active="agenda" />
      <div className="main">
        <CRMHeader theme={theme} onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
        <div className="subbar">
          <div style={{ display: 'flex', gap: 4 }}>
            <button className={`btn-out${view === 'semaine' ? ' on' : ''}`} onClick={() => setView('semaine')} aria-pressed={view === 'semaine'}>Semaine</button>
            <button className={`btn-out${view === 'mois' ? ' on' : ''}`} onClick={() => setView('mois')} aria-pressed={view === 'mois'}>Mois</button>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <button className="btn-icon" onClick={() => shift(-1)} aria-label={view === 'semaine' ? 'Semaine précédente' : 'Mois précédent'}><AI.Prev /></button>
            <span style={{ fontSize: '0.75rem', fontWeight: 700, minWidth: 150, textAlign: 'center' }}>{rangeLabel}</span>
            <button className="btn-icon" onClick={() => shift(1)} aria-label={view === 'semaine' ? 'Semaine suivante' : 'Mois suivant'}><AI.Next /></button>
            <button className="btn-out" style={{ fontSize: '0.6875rem' }} onClick={goToday}>Aujourd’hui</button>
          </div>
          <button className="btn-pri" style={{ background: '#15803D', color: '#fff' }} onClick={() => setModal(selected)}><AI.Plus />Créer un rendez-vous</button>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl">Démo · état</span>
            <select className="state-sel" value={scenario} onChange={e => setSc(e.target.value)} aria-label="État de démonstration">{SCENARIOS.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
          </div>
        </div>
        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          <div className="content">
            <RecapLine range={range} evs={evs} label={rangeLabel} conflicts={conflicts} />
            <AgLegend />
            <div className="ag-layout">
              <div>
                {view === 'semaine'
                  ? <WeekView start={weekStart} evs={evs} selected={selected} onSelect={setSelected} onMove={onMove} conflicts={conflicts} />
                  : <MonthView ym={ym} evs={evs} selected={selected} onSelect={setSelected} onMove={onMove} conflicts={conflicts} />}
                <div style={{ marginTop: 9, fontSize: '0.5625rem', color: 'var(--fg3)', lineHeight: 1.6 }}>Seules les échéances de tâches se déplacent : glissez-les vers une autre journée, ou utilisez « Déplacer au » dans le détail. Les envois de rapports suivent la date promise au client, les exécutions suivent leur planification.</div>
              </div>
              <DayPanel date={selected} evs={evs} conflicts={conflicts} onMove={onMove} onNew={d => setModal(d)} />
            </div>
          </div>
        </div>
      </div>
      {toast && <div className="hp-toast" role="status">{toast}</div>}
      {modal && <NewRdvModal date={modal} evs={evs} onClose={() => setModal(null)} onCreate={onCreate} />}
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script type="text/babel" src="hp-search-data.jsx"></script>
<script type="text/babel" src="hp-notif-data.jsx"></script>
<script type="text/babel" src="hp-overlays.jsx"></script>
</body>
</html>
