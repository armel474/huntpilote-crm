<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
@font-face {
  font-family: 'Noto Sans';
  src: url('fonts/NotoSans-VariableFont_wdth_wght.ttf') format('truetype-variations');
  font-weight: 100 900; font-stretch: 62.5% 100%; font-style: normal; font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg-0: #0D0D12;
  --bg-1: #13131A;
  --bg-2: #1A1A24;
  --bg-3: #22222E;
  --bg-4: #2C2C3C;
  --bd:   rgba(255,255,255,0.07);
  --bd-1: rgba(255,255,255,0.11);
  --bd-2: rgba(255,255,255,0.18);
  --fg-1: #F0F0F8;
  --fg-2: #A8A8C0;
  --fg-3: #6868A0;
  --fg-4: #44446A;
  --green:    #4ADE80;
  --green-d:  rgba(74,222,128,0.11);
  --green-b:  rgba(74,222,128,0.24);
  --green-fg: #86EFAC;
  --yellow:    #FBBF24;
  --yellow-d:  rgba(251,191,36,0.11);
  --yellow-b:  rgba(251,191,36,0.28);
  --yellow-fg: #FDE68A;
  --red:    #F87171;
  --red-d:  rgba(248,113,113,0.11);
  --red-b:  rgba(248,113,113,0.26);
  --blue:    #60A5FA;
  --blue-d:  rgba(96,165,250,0.11);
  --blue-b:  rgba(96,165,250,0.26);
  --blue-fg: #93C5FD;
  --violet:    #A78BFA;
  --violet-d:  rgba(167,139,250,0.11);
  --violet-b:  rgba(167,139,250,0.26);
  --violet-fg: #C4B5FD;
  --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 14px rgba(0,0,0,0.55);
  --header-h: 54px;
  --nav-w: 56px;
  --left-w: 250px;
  --right-w: 252px;
}
[data-theme="light"] {
  --bg-0: #F2F2F7; --bg-1: #FAFAFD; --bg-2: #FFFFFF; --bg-3: #EDEDF4; --bg-4: #E0E0EA;
  --bd: rgba(20,20,48,0.08); --bd-1: rgba(20,20,48,0.13); --bd-2: rgba(20,20,48,0.22);
  --fg-1: #14141F; --fg-2: #464663; --fg-3: #6C6C8A; --fg-4: #9C9CB6;
  --green: #16A34A; --green-d: rgba(22,163,74,0.10); --green-b: rgba(22,163,74,0.30); --green-fg: #15803D;
  --yellow: #D97706; --yellow-d: rgba(217,119,6,0.10); --yellow-b: rgba(217,119,6,0.30); --yellow-fg: #B45309;
  --red: #DC2626; --red-d: rgba(220,38,38,0.09); --red-b: rgba(220,38,38,0.28);
  --blue: #2563EB; --blue-d: rgba(37,99,235,0.09); --blue-b: rgba(37,99,235,0.28); --blue-fg: #1D4ED8;
  --violet: #7C3AED; --violet-d: rgba(124,58,237,0.09); --violet-b: rgba(124,58,237,0.28); --violet-fg: #6D28D9;
  --shadow: 0 1px 2px rgba(20,20,48,0.05), 0 4px 16px rgba(20,20,48,0.06);
}
[data-theme-switching],[data-theme-switching] *,[data-theme-switching] *::before,[data-theme-switching] *::after { transition: background-color 380ms ease, color 300ms ease, border-color 380ms ease, box-shadow 380ms ease !important; }
[data-theme="light"] body::before { opacity: 0.6; }
[data-theme="light"] .nav-item:hover { background: rgba(20,20,48,0.06); }
[data-theme="light"] ::-webkit-scrollbar-thumb { background: var(--bd-2); }

body {
  font-family: var(--font);
  background: var(--bg-0);
  color: var(--fg-1);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  height: 100vh;
}

/* Scrollbars */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bd-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-4); }

/* Background glow */
body::before {
  content: ''; position: fixed; width: 50rem; height: 50rem;
  top: -20rem; left: 8rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(74,222,128,0.08) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}

/* Card utility */
.card {
  background: var(--bg-2);
  border: 1px solid var(--bd);
  border-radius: 10px;
  box-shadow: var(--shadow);
}

/* Tab buttons */
.fc3-tab {
  padding: 9px 14px; border-radius: 0; background: transparent; border: none;
  border-bottom: 2px solid transparent;
  color: var(--fg-3); font-size: 0.75rem; font-weight: 500;
  cursor: pointer; font-family: var(--font); white-space: nowrap;
  transition: color 150ms, border-color 150ms;
}
.fc3-tab:hover { color: var(--fg-2); }
.fc3-tab.active {
  color: var(--fg-1); font-weight: 700;
  border-bottom-color: var(--green);
}

/* Nav item */
.nav-item {
  width: 34px; height: 34px; border-radius: 8px; margin: 1px auto;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 150ms; color: var(--fg-3);
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,0.07); color: var(--fg-1); }
.nav-item.active { background: var(--green-d); color: var(--green-fg); border: 1px solid var(--green-b); }
.nav-item[data-label]:hover::after {
  content: attr(data-label);
  position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
  background: var(--bg-3); color: var(--fg-1); border: 1px solid var(--bd-1);
  padding: 4px 10px; border-radius: 6px; font-size: 0.6875rem; font-weight: 500;
  white-space: nowrap; pointer-events: none; z-index: 400;
  font-family: var(--font); box-shadow: var(--shadow);
}

/* Action button */
.act-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: 7px;
  font-family: var(--font); font-size: 0.6875rem; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: all 140ms;
  background: var(--bg-3); border: 1px solid var(--bd-1); color: var(--fg-2);
}
.act-btn:hover { background: var(--bg-4); color: var(--fg-1); border-color: var(--bd-2); }
.act-btn.primary {
  background: var(--green-d); border-color: var(--green-b); color: var(--green-fg);
}
.act-btn.primary:hover { background: rgba(74,222,128,0.18); }

/* State selector */
.state-select {
  padding: 4px 10px; border-radius: 6px;
  background: var(--bg-3); border: 1px solid var(--bd-1); color: var(--fg-2);
  font-family: var(--font); font-size: 0.625rem; font-weight: 600;
  cursor: pointer; appearance: none; outline: none;
}

/* Pulse animation */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* Search */
.header-search {
  background: var(--bg-3); border: 1px solid var(--bd-1); border-radius: 7px;
  padding: 5px 10px 5px 28px; color: var(--fg-1); font-family: var(--font);
  font-size: 0.6875rem; outline: none; width: 160px; transition: border-color 150ms;
}
.header-search:focus { border-color: var(--green); }
.header-search::placeholder { color: var(--fg-4); }

/* Theme + drawer buttons */
.hdr-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-3); border: 1px solid var(--bd-1); color: var(--fg-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; flex-shrink: 0; transition: color 150ms, background 150ms; }
.hdr-btn:hover { color: var(--fg-1); background: var(--bg-4); }
.fc4-mobile-only { display: none !important; }
.fc4-side { display: contents; }
.fc4-scrim { display: none; }
.fc4-actions { overflow-x: auto; scrollbar-width: none; }
.fc4-actions::-webkit-scrollbar { display: none; }

/* Tablette / fenêtre étroite ≤ 1180px : panneaux latéraux en tiroirs, rangées empilées */
@media (max-width: 1180px) {
  .fc4-mobile-only { display: inline-flex !important; }
  .fc4-side { display: block; position: fixed; top: var(--header-h); bottom: 0; width: min(86vw, 320px); z-index: 55; transition: transform 280ms cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 40px rgba(0,0,0,0.35); }
  .fc4-side > div { width: 100% !important; height: 100% !important; }
  .fc4-side-left { left: 0; transform: translateX(-105%); }
  .fc4-side-right { right: 0; transform: translateX(105%); }
  .fc4-side.open { transform: none; }
  .fc4-scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 54; }
  #root .fc4-row { flex-direction: column !important; }
  #root .fc4-row > * { flex: 1 1 auto !important; width: 100% !important; }
}

/* Mobile ≤ 768px */
@media (max-width: 768px) {
  .fc4-mobile-only { display: inline-flex !important; }
  .fc4-desk-only { display: none !important; }
  .hdr-btn, .act-btn, .fc3-tab, .state-select { min-height: 44px; }
  .hdr-btn { width: 44px; height: 44px; }
  .fc4-header { padding: 0 12px !important; gap: 8px !important; }
  .fc4-header .header-search { display: none; }
  .fc4-nav { position: fixed !important; left: 0; right: 0; bottom: 0; width: 100% !important; height: calc(56px + env(safe-area-inset-bottom)) !important; padding-bottom: env(safe-area-inset-bottom); flex-direction: row !important; border-right: none !important; border-top: 1px solid var(--bd); z-index: 60; }
  .fc4-nav > div { padding: 0 !important; border: none !important; flex-direction: row !important; justify-content: space-around; align-items: center; }
  .fc4-nav > div:first-child { display: none !important; }
  .fc4-nav .nav-item { width: 44px; height: 44px; margin: 0; }
  .fc4-nav .nav-item[data-label]:hover::after { display: none; }
  .fc4-main { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  .fc4-side { bottom: calc(56px + env(safe-area-inset-bottom)); }
  .fc4-content { padding: 12px 12px 24px !important; }
  .fc4-actions { padding: 8px 12px !important; }
  #root [style*="grid-template-columns"]:not(.fc4-table) { grid-template-columns: 1fr 1fr !important; }
  #root .fc4-row { flex-direction: column !important; }
  #root .fc4-row > * { flex: 1 1 auto !important; width: 100% !important; }
  .fc4-table { grid-template-columns: 72px 1fr !important; }
  .fc4-table > :nth-child(5n+3), .fc4-table > :nth-child(5n+4), .fc4-table > :nth-child(5n+5) { display: none !important; }
}
@media (max-width: 480px) {
  #root [style*="grid-template-columns"]:not(.fc4-table):not(.fc4-keep2) { grid-template-columns: 1fr !important; }
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { NavIco, Ico, Badge, Dot, Gauge, Spark, Delta, Lbl } = window;
const { LeftPanel, RightPanel, PanelApercu, PanelSEO, PanelPlan, PanelDiag, PanelReports, PanelContrat, FC3_CLIENT } = window; /* LeftPanel/RightPanel/PanelApercu/PanelReports come from fc4-panels.jsx */

/* ── NAV SIDEBAR ── */
const NavSidebar = ({ tab, onNav }) => {
  const Logo = () => (
    <div style={{width:30,height:30,background:'var(--green-d)',border:'1px solid var(--green-b)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green-fg)" strokeWidth="2.5" strokeLinecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
  );
  const navItems = [
    {id:'dashboard', label:'Dashboard',  Icon:NavIco.Dash,  href:'Dashboard.html'},
    {id:'clienthub', label:'Client Hub', Icon:NavIco.Users, href:'Client Hub.html'},
    {id:'pipeline',  label:'Pipeline',   Icon:NavIco.Pipe,  href:'Pipeline.html'},
    {id:'workflow',  label:'Workflow',   Icon:NavIco.Zap,   href:'Workflow.html'},
  ];
  return (
    <div className="fc4-nav" style={{width:'var(--nav-w)',flexShrink:0,background:'var(--bg-1)',borderRight:'1px solid var(--bd)',display:'flex',flexDirection:'column',height:'100vh',position:'relative',zIndex:10}}>
      <div style={{padding:'13px 0',borderBottom:'1px solid var(--bd)',display:'flex',justifyContent:'center'}}><Logo/></div>
      <div style={{flex:1,padding:'10px 0',display:'flex',flexDirection:'column',gap:2}}>
        {navItems.map(({id,label,Icon,href})=>(
          <div key={id} className={`nav-item${id==='clienthub'?' active':''}`} data-label={label}
            onClick={()=>href&&(window.location.href=href)}>
            <Icon/>
          </div>
        ))}
      </div>
      <div style={{padding:'10px 0',borderTop:'1px solid var(--bd)',display:'flex',flexDirection:'column',gap:2}}>
        <div className="nav-item" data-label="Paramètres" onClick={()=>window.location.href='Parametres.html'}><NavIco.Cog/></div>
      </div>
    </div>
  );
};

/* ── HEADER ── */
const AppHeader = ({ uxState, setUxState, theme, toggleTheme, drawer, setDrawer }) => {
  const [search, setSearch] = useState('');
  const UX_STATES = [
    {id:'active',     label:'Client actif complet'},
    {id:'onboarding', label:'Onboarding en cours'},
    {id:'nodata',     label:'Sans intégrations SEO'},
    {id:'audit',      label:'Audit en cours'},
    {id:'stale',      label:'Données obsolètes'},
    {id:'nocritical', label:'Aucune priorité critique'},
    {id:'error',      label:'Erreur partielle'},
  ];
  return (
    <div className="fc4-header" style={{height:'var(--header-h)',flexShrink:0,background:'var(--bg-1)',borderBottom:'1px solid var(--bd)',display:'flex',alignItems:'center',padding:'0 18px',gap:12,zIndex:9}}>
      <button className="hdr-btn fc4-mobile-only" title="Infos client" onClick={()=>setDrawer(drawer==='left'?null:'left')}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 6h16M4 12h10M4 18h16"/></svg></button>
      {/* Breadcrumb */}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'1rem',fontWeight:800,letterSpacing:'-0.025em',color:'var(--fg-1)',lineHeight:1}}>{FC3_CLIENT.name}</div>
        <div style={{fontSize:'0.5625rem',color:'var(--fg-3)',marginTop:2,display:'flex',alignItems:'center',gap:5,overflow:'hidden',whiteSpace:'nowrap'}}>
          <span style={{cursor:'pointer'}} onClick={()=>window.location.href='Client Hub.html'}>Client Hub</span>
          <span style={{color:'var(--bd-2)'}}>›</span>
          <span style={{color:'var(--fg-2)',fontWeight:500}}>{FC3_CLIENT.name}</span>
          <span style={{color:'var(--bd-2)'}}>·</span>
          <span className="fc4-desk-only">{FC3_CLIENT.sector} · {FC3_CLIENT.mrr}/m</span>
        </div>
      </div>

      {/* UX state switcher — demo tool */}
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <span className="fc4-desk-only" style={{fontSize:'0.5rem',fontWeight:700,color:'var(--fg-4)',textTransform:'uppercase',letterSpacing:'0.08em'}}>État UX</span>
        <select className="state-select" value={uxState} onChange={e=>setUxState(e.target.value)}>
          {UX_STATES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
        </select>
      </div>

      {/* Search */}
      <div style={{position:'relative',display:'flex',alignItems:'center'}}>
        <span style={{position:'absolute',left:8,color:'var(--fg-4)',pointerEvents:'none',display:'flex'}}><NavIco.Search/></span>
        <input className="header-search" placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>

      {/* Theme */}
      <button className="hdr-btn" title={theme==='dark'?'Mode clair':'Mode sombre'} onClick={toggleTheme}>
        {theme==='dark'
          ?<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          :<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>}
      </button>

      {/* Bell */}
      <button className="hdr-btn fc4-desk-only">
        <NavIco.Bell/>
        <span style={{position:'absolute',top:4,right:4,width:6,height:6,background:'var(--red)',borderRadius:'50%',border:'1.5px solid var(--bg-1)'}}></span>
      </button>

      {/* PM avatar */}
      <div className="fc4-desk-only" style={{width:28,height:28,borderRadius:'50%',background:'var(--green-d)',color:'var(--green-fg)',border:'1.5px solid var(--green-b)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.5625rem',fontWeight:700,flexShrink:0}}>{FC3_CLIENT.pmInit}</div>
      <button className="hdr-btn fc4-mobile-only" title="Intelligence" onClick={()=>setDrawer(drawer==='right'?null:'right')}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></button>
    </div>
  );
};

/* ── ACTION BAR ── */
const ActionBar = ({ setTab }) => (
  <div className="fc4-actions" style={{display:'flex',alignItems:'center',gap:6,padding:'10px 20px',borderBottom:'1px solid var(--bd)',background:'var(--bg-1)'}}>
    <button className="act-btn" onClick={()=>setTab('diag')}><Ico.Zap/>Lancer un diagnostic</button>
    <button className="act-btn" onClick={()=>setTab('seo')}><Ico.Flag/>Assigner une priorité</button>
    <button className="act-btn" onClick={()=>setTab('plan')}><Ico.Plus/>Créer une tâche</button>
    <button className="act-btn primary" onClick={()=>setTab('reports')}><Ico.Doc/>Générer le rapport client</button>
  </div>
);

/* ── TABS NAV ── */
const TABS = [
  {id:'apercu',   label:'Aperçu'},
  {id:'seo',      label:'Priorités SEO'},
  {id:'plan',     label:"Plan d'action"},
  {id:'diag',     label:'Diagnostics'},
  {id:'contenu',  label:'Contenu', href:'Calendrier Editorial.html'},
  {id:'reports',  label:'Rapports client'},
  {id:'contrat',  label:'Contrat & facturation'},
];

const TabsNav = ({ tab, setTab }) => (
  <div style={{display:'flex',borderBottom:'1px solid var(--bd)',background:'var(--bg-1)',padding:'0 20px',overflowX:'auto'}}>
    {TABS.map(t=>(
      <button key={t.id} className={`fc3-tab${tab===t.id?' active':''}`} onClick={()=>t.href?(window.location.href=t.href):setTab(t.id)}>
        {t.label}
      </button>
    ))}
  </div>
);

/* ── MAIN APP ── */
const App = () => {
  const [tab, setTab] = useState(()=>localStorage.getItem('hp-fc4-tab')||'apercu');
  const [uxState, setUxState] = useState(()=>localStorage.getItem('hp-fc3-state')||'active');
  const [theme, setTheme] = useState(()=>document.documentElement.getAttribute('data-theme')||'dark');
  const [drawer, setDrawer] = useState(null);

  useEffect(()=>{
    const h=document.documentElement;
    h.setAttribute('data-theme-switching','');
    h.setAttribute('data-theme',theme);
    try{localStorage.setItem('hp-theme',theme);}catch{}
    const t=setTimeout(()=>h.removeAttribute('data-theme-switching'),450);
    return ()=>clearTimeout(t);
  },[theme]);
  useEffect(()=>{
    const mq=matchMedia('(prefers-color-scheme: light)');
    const on=e=>{let s=null;try{s=localStorage.getItem('hp-theme')}catch{} if(!s) setTheme(e.matches?'light':'dark');};
    mq.addEventListener('change',on); return ()=>mq.removeEventListener('change',on);
  },[]);
  const toggleTheme = () => setTheme(t=>t==='dark'?'light':'dark');

  const updateTab = t => { setTab(t); setDrawer(null); localStorage.setItem('hp-fc4-tab', t); };
  const updateState = s => { setUxState(s); localStorage.setItem('hp-fc3-state', s); };

  const renderPanel = () => {
    switch(tab) {
      case 'apercu':   return <PanelApercu uxState={uxState} setTab={updateTab}/>;
      case 'seo':      return <PanelSEO setTab={updateTab}/>;
      case 'plan':     return <PanelPlan/>;
      case 'diag':     return <PanelDiag/>;
      case 'reports':  return <PanelReports/>;
      case 'contrat':  return <PanelContrat/>;
      default:         return null;
    }
  };

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'var(--bg-0)',position:'relative',zIndex:1}}>
      {/* Nav sidebar */}
      <NavSidebar tab={tab} onNav={updateTab}/>

      {/* Main area */}
      <div className="fc4-main" style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        {/* Global header */}
        <AppHeader uxState={uxState} setUxState={updateState} theme={theme} toggleTheme={toggleTheme} drawer={drawer} setDrawer={setDrawer}/>

        {/* Three-column body */}
        <div style={{flex:1,display:'flex',overflow:'hidden',position:'relative'}}>
          {drawer&&<div className="fc4-scrim" onClick={()=>setDrawer(null)}></div>}

          {/* LEFT — client context */}
          <div className={`fc4-side fc4-side-left${drawer==='left'?' open':''}`}><LeftPanel uxState={uxState} setTab={updateTab}/></div>

          {/* CENTER — work zone */}
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
            {/* Sticky top: actions + tabs */}
            <div style={{flexShrink:0}}>
              <ActionBar setTab={updateTab}/>
              <TabsNav tab={tab} setTab={updateTab}/>
            </div>
            {/* Scrollable content */}
            <div className="fc4-content" style={{flex:1,overflowY:'auto',padding:'16px 20px 28px',background:'var(--bg-0)'}}>
              {renderPanel()}
            </div>
          </div>

          {/* RIGHT — intelligence */}
          <div className={`fc4-side fc4-side-right${drawer==='right'?' open':''}`}><RightPanel setTab={updateTab}/></div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script type="text/babel" src="hp-search-data.jsx"></script>
<script type="text/babel" src="hp-notif-data.jsx"></script>
<script type="text/babel" src="hp-overlays.jsx"></script>
</body>
</html>
