<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { NavSidebar } = window;
const { RI, RPill2, AR_STATUS, TriggerPicker, CondEditor, ActionPicker, NaturalPreview, StatusBanner, DryRun, ExecLog, DangerZone, arSentence } = window;

const I = {
  Srch: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>,
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};

const CRMHeader = ({ theme, onToggleTheme, name }) => (
  <div className="crm-header">
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{name || 'Nouvelle automatisation'}</div>
      <div className="crumb"><a href="Dashboard.html">Accueil</a><span>›</span><a href="Workflow.html">Workflow</a><span>›</span><b>Éditeur de règle</b></div>
    </div>
    <div className="search-wrap"><span className="search-ico"><I.Srch /></span><input className="search-inp" placeholder="Rechercher…" readOnly /></div>
    <button className="btn-icon" title="Notifications"><I.Bell /><span style={{ position: 'absolute', top: 3, right: 3, width: 6, height: 6, background: 'var(--red)', borderRadius: '50%', border: '1.5px solid var(--bg-base)' }}></span></button>
    <button className="btn-icon" onClick={onToggleTheme} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <I.Sun /> : <I.Moon />}</button>
    <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MC</div>
  </div>);

const SCENARIOS = [['active', 'Règle active'], ['nouvelle', 'Nouvelle règle'], ['pause', 'Règle en pause'], ['echec', 'Échecs répétés'], ['jamais', 'Jamais déclenchée']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [scenario, setScenario] = useState(() => { try { return localStorage.getItem('hp-ar-scenario') || 'active'; } catch { return 'active'; } });
  const init = window.arScenario(scenario);
  const [rule, setRule] = useState(init.rule);
  const [log, setLog] = useState(init.log);
  const [dry, setDry] = useState(null);
  const [replayed, setReplayed] = useState([]);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const on = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', on); return () => mq.removeEventListener('change', on);
  }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 5000); return () => clearTimeout(t); }, [toast]);

  const setSc = s => {
    const n = window.arScenario(s);
    setScenario(s); setRule(n.rule); setLog(n.log); setDry(null); setReplayed([]);
    try { localStorage.setItem('hp-ar-scenario', s); } catch {}
  };
  /* Toute modification des réglages invalide le test à blanc : on ne peut pas activer sur un test périmé. */
  const editRule = fn => { setRule(fn); setDry(null); };

  const s = arSentence(rule);
  const complete = !!(s.when && s.then && rule.name.trim());
  const tested = !!dry;
  const runDry = () => setDry(window.arDryRun(rule));
  const activate = () => {
    setRule(r => ({ ...r, status: 'active' }));
    setToast(`« ${rule.name} » est active. Prochaine évaluation au prochain relevé — le journal ci-dessous enregistrera chaque exécution.`);
  };
  const pause = () => { setRule(r => ({ ...r, status: 'pause' })); setToast('Règle mise en pause. Les déclenchements sont ignorés, le journal est conservé.'); };
  const replay = id => { setReplayed(r => [...r, id]); setLog(l => l.map(x => x.id === id ? { ...x, ok: true, matched: 1, err: false, produced: 'Rejouée avec succès — priorité P-0662 créée', href: 'Priorite Detail.html' } : x)); setToast(`Exécution ${id} rejouée avec succès.`); };
  const del = () => setToast('Suppression annulée pour la démonstration — le journal d’exécution serait perdu avec la règle.');

  const canActivate = complete && tested && (dry ? dry.length <= window.AR_DRY_MAX : false) && rule.status !== 'active';

  return (
    <div className="app-shell">
      <NavSidebar active="workflow" />
      <div className="main">
        <CRMHeader theme={theme} onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} name={rule.name} />
        <div className="subbar">
          <RPill2 label={AR_STATUS[rule.status][0]} tone={AR_STATUS[rule.status][1]} icon={React.createElement(AR_STATUS[rule.status][2])} />
          {rule.status === 'active'
            ? <button className="btn-out" onClick={pause}><RI.Pause />Mettre en pause</button>
            : <button className="btn-pri" style={{ background: '#15803D', color: '#fff' }} onClick={activate} disabled={!canActivate}
                title={!complete ? 'Nommez la règle, choisissez un déclencheur et une action' : !tested ? 'Lancez le test à blanc avant d’activer' : dry && dry.length > window.AR_DRY_MAX ? 'Le test dépasse le seuil de vigilance' : 'Activer la règle'}>
                <RI.Check />Activer la règle
              </button>}
          {!complete && <span style={{ fontSize: '0.625rem', color: 'var(--fg3)' }}>Règle incomplète</span>}
          {complete && !tested && rule.status !== 'active' && <span style={{ fontSize: '0.625rem', color: 'var(--yellow-fg)', fontWeight: 700 }}>Test à blanc exigé avant activation</span>}
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl">Démo · état</span>
            <select className="state-sel" value={scenario} onChange={e => setSc(e.target.value)} aria-label="État de démonstration">{SCENARIOS.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
          </div>
        </div>
        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          <div className="content">
            <div className="card ar-sec">
              <label className="lbl" htmlFor="ar-nm" style={{ display: 'block', marginBottom: 5 }}>Nom de la règle</label>
              <input id="ar-nm" className="ar-name" value={rule.name} onChange={e => setRule(r => ({ ...r, name: e.target.value }))} placeholder="Nommez la règle, p. ex. « Alerte chute de position »" />
              <div style={{ fontSize: '0.6875rem', color: 'var(--fg3)', marginTop: 8, lineHeight: 1.5 }}>{rule.desc || 'Décrivez en une ligne ce que cette règle surveille — le nom apparaît tel quel dans la liste des automatisations.'}</div>
            </div>
            <StatusBanner rule={rule} log={log} tested={tested} />
            <NaturalPreview rule={rule} />
            <TriggerPicker rule={rule} set={editRule} />
            <CondEditor rule={rule} set={editRule} />
            <ActionPicker rule={rule} set={editRule} />
            <DryRun rule={rule} open={true} onRun={runDry} result={dry} />
            <ExecLog log={log} onReplay={replay} replayed={replayed} />
            <DangerZone rule={rule} tested={tested} onDelete={del} />
          </div>
        </div>
      </div>
      {toast && <div className="hp-toast" role="status" style={{ position: 'fixed', left: '50%', transform: 'translateX(-50%)', bottom: 18, zIndex: 80, background: 'var(--fg1)', color: 'var(--bg-solid)', padding: '9px 14px', borderRadius: 10, fontSize: '0.6875rem', fontWeight: 600, boxShadow: '0 8px 30px rgba(0,0,0,0.28)', maxWidth: 'min(620px,92vw)', lineHeight: 1.45 }}>{toast}</div>}
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script type="text/babel" src="hp-search-data.jsx"></script>
<script type="text/babel" src="hp-notif-data.jsx"></script>
<script type="text/babel" src="hp-overlays.jsx"></script>
</body>
</html>
