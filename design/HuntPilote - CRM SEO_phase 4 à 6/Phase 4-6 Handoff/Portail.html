<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Votre espace client — Acme Corp. · HuntPilote</title>
<script>(function(){var s=null;try{s=localStorage.getItem('hp-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="rp-data.jsx"></script>
<script type="text/babel" src="rp-body.jsx"></script>
<script type="text/babel" src="pc-data.jsx"></script>
<script type="text/babel" src="pc-nav.jsx"></script>
<link rel="stylesheet" href="rp-doc.css">
<link rel="stylesheet" href="pc-portal.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { RIco, REPORT, PC_ACCOUNT, PC_THREAD, PC_ONBOARD_STEPS, pcScenario, pcMonth } = window;

const QI = {
  Logo: ({ dark }) => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={dark ? '#18181B' : '#fff'} strokeWidth="2.5" strokeLinecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>,
  Lock: () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0110 0v4" /></svg>,
  Prev: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6" /></svg>,
  Next: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6" /></svg>,
  Send: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>,
  Chat: () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" /></svg>,
  Out: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>,
  Clock: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>,
};

const Delta = ({ d, up }) => <span className="delta" style={up ? null : { background: 'var(--yellow-m)', borderColor: 'var(--yellow-b)', color: 'var(--yellow-fg)' }}>{up ? <RIco.Up /> : <RIco.Down />}{d}</span>;

/* ── APERÇU DES ÉCHANGES ── */
const ThreadPeek = () => {
  const last = PC_THREAD[PC_THREAD.length - 1];
  return (
    <div className="doc" style={{ marginTop: '1.25rem' }}>
      <div className="sect" style={{ borderTop: 0 }}>
        <div className="sect-head"><span className="step"><QI.Chat /></span><h2>Vos échanges avec {PC_ACCOUNT.pm}</h2></div>
        <p style={{ marginBottom: 16 }}>Une question sur ce rapport ? Écrivez à {PC_ACCOUNT.pm} en rattachant votre question au chiffre ou au chantier concerné — elle voit tout de suite de quoi il s’agit.</p>
        <div style={{ padding: '1rem 1.1rem', borderRadius: 13, background: 'var(--bg-muted)', border: '1px solid var(--bd-solid)' }}>
          <div style={{ fontSize: '0.75rem', color: 'var(--fg3)', marginBottom: 5, fontWeight: 600 }}>Dernier message · {PC_ACCOUNT.pm} · {last.at}</div>
          <p style={{ fontSize: '0.9375rem', margin: 0 }}>{last.text}</p>
        </div>
        <div style={{ display: 'flex', gap: 9, marginTop: 14, flexWrap: 'wrap', alignItems: 'center' }}>
          <a href="Portail Echanges.html" className="pc-btn solid"><QI.Chat />Ouvrir vos échanges</a>
          <span className="pc-hint">Réponse en général dans la journée ouvrable.</span>
        </div>
      </div>
    </div>);
};

/* ── AUCUN RAPPORT PUBLIÉ ── */
const NotYet = ({ theme }) => (
  <div className="pc-wait">
    <div className="pc-wait-card">
      <div className="pc-sent warn" style={{ marginBottom: '1.25rem' }}><QI.Clock /></div>
      <h1 style={{ fontSize: '1.625rem', marginBottom: 10 }}>Votre premier rapport arrive le 2 octobre</h1>
      <p className="lead">Votre espace est bien ouvert — il n’y a simplement rien à lire pour l’instant. Nous publions un rapport par mois, et le premier a besoin d’un mois complet de données pour dire quelque chose d’utile.</p>
      <div className="pc-sep"></div>
      <h3 style={{ marginBottom: 4 }}>Où nous en sommes</h3>
      <ul className="pc-tl">
        {PC_ONBOARD_STEPS.map(([state, title, text]) => (
          <li key={title}>
            <span className={`dot ${state}`}>{state === 'done' ? <RIco.Check /> : state === 'now' ? '•' : ''}</span>
            <div style={{ minWidth: 0 }}>
              <h3 style={{ marginBottom: 2, color: state === 'todo' ? 'var(--fg3)' : 'var(--fg1)' }}>{title}</h3>
              <p style={{ fontSize: '0.9375rem', margin: 0 }}>{text}</p>
            </div>
          </li>))}
      </ul>
      <div className="pc-frozen-in" style={{ marginTop: 4 }}>
        <span><QI.Lock /></span>
        <div>Vous recevrez un courriel dès la publication. <b>Rien à surveiller d’ici là</b> — et rien ne se passe dans cet espace entre deux rapports.</div>
      </div>
      <div style={{ marginTop: '1.25rem' }}>
        <a href={`mailto:${PC_ACCOUNT.pmEmail}`} className="pc-btn"><QI.Send />Écrire à {PC_ACCOUNT.pm}</a>
      </div>
    </div>
  </div>);

const SCENARIOS = [['normal', 'Rapport du mois'], ['premier', 'Premier mois, sans comparaison'], ['aucun', 'Aucun rapport publié'], ['sanspreuve', 'Mois sans preuve'], ['multi', 'Plusieurs établissements']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [scenario, setScenario] = useState('normal');
  const sc = pcScenario(scenario);
  const [monthId, setMonthId] = useState(sc.month);
  const [place, setPlace] = useState('all');

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);

  const setSc = s => { setScenario(s); setMonthId(pcScenario(s).month); setPlace('all'); };

  const months = sc.months;
  const m = pcMonth(monthId);
  const idx = months.findIndex(x => x.id === monthId);
  const first = !m.prev;
  const proofs = sc.proofs ? REPORT.proofs.filter(p => p.on) : [];
  /* Le rapport publié, requalifié pour la période consultée. Le corps, lui, est celui de la session 1.3. */
  const R = { ...REPORT, period: m.period, publish: m.publish, score: { now: m.score, prev: m.prevScore == null ? m.score : m.prevScore } };

  return (
    <React.Fragment>
      <div className="pc-demo">
        <select value={scenario} onChange={e => setSc(e.target.value)} aria-label="État de démonstration">{SCENARIOS.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
      </div>
      <window.PortalHeader theme={theme} onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} active="tableau" unread={1} />

      {!sc.published ? <NotYet theme={theme} /> : (
        <React.Fragment>
          <div className="pc-period">
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <button className="pc-icon" disabled={idx >= months.length - 1} onClick={() => setMonthId(months[idx + 1].id)} aria-label="Mois précédent"><QI.Prev /></button>
              <button className="pc-icon" disabled={idx <= 0} onClick={() => setMonthId(months[idx - 1].id)} aria-label="Mois suivant"><QI.Next /></button>
            </div>
            <div className="pc-months" role="tablist" aria-label="Rapports publiés">
              {months.map(x => <button key={x.id} role="tab" aria-selected={x.id === monthId} className={`pc-month${x.id === monthId ? ' on' : ''}`} onClick={() => setMonthId(x.id)}>{x.label} 2026</button>)}
            </div>
            <span className="pc-hint" style={{ marginLeft: 'auto' }}>{months.length} rapport{months.length > 1 ? 's' : ''} publié{months.length > 1 ? 's' : ''}</span>
          </div>

          {sc.places && (
            <div className="pc-period" style={{ paddingTop: '0.75rem' }}>
              <span style={{ fontSize: '0.8125rem', fontWeight: 700, color: 'var(--fg2)' }}>Établissement</span>
              <div className="pc-places">
                {sc.places.map(p => <button key={p.id} className={`pc-place${place === p.id ? ' on' : ''}`} onClick={() => setPlace(p.id)}>{p.label}</button>)}
              </div>
              <span className="pc-hint" style={{ marginLeft: 'auto' }}>{place === 'all' ? 'Chiffres additionnés des deux adresses' : 'Chiffres de cette adresse seulement'}</span>
            </div>)}

          <div className="pc-frozen">
            <div className="pc-frozen-in">
              <span><QI.Lock /></span>
              <div>
                <b>Données au {m.dataAt}</b>, publiées le {m.publish}. Ce n’est pas un tableau de bord en direct : cette page ne bougera plus jusqu’au prochain rapport.
                {first && <React.Fragment> C’est votre premier rapport — <b>aucune comparaison n’est possible</b>, il servira de point de départ.</React.Fragment>}
              </div>
            </div>
          </div>

          <div className="wrap" style={{ paddingTop: '1.25rem', paddingBottom: '1rem' }}>
            <window.ReportDoc R={R} first={first} theme={theme} proofs={proofs} Delta={Delta} RIco={RIco} prevLabel={m.prev} nextLabel={m.next} afterNextLabel={m.after} />
          </div>
          <div className="wrap" style={{ paddingTop: 0 }}>
            <ThreadPeek />
          </div>
        </React.Fragment>)}
    </React.Fragment>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
