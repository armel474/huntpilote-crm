[data-theme-switching],[data-theme-switching] *,

body { font-family: var(--font); background: var(--bg-base); color: var(--fg1); -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; }
body::before, body::after { content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); opacity: 0.6; }

[data-theme="dark"] body::before { opacity: 0.32; }

      <div style={{ padding: '15px 0 13px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'center' }}>
        <div style={{ width: 28, height: 28, background: 'var(--primary)', borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--primary-fg)" strokeWidth="2.5" strokeLinecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>
        </div>
      </div>
      <div style={{ flex: 1, padding: '8px 0', display: 'flex', flexDirection: 'column', gap: 2 }}>
        {items.map(({ id, label, Icon, href }) =>
          <div key={id} className={`nav-cpt${id === active ? ' active' : ''}`} data-label={label} onClick={() => href && (window.location.href = href)}><Icon /></div>
        )}
      </div>
      <div style={{ padding: '8px 0', borderTop: '1px solid var(--border)' }}>
        <div className="nav-cpt" data-label="Paramètres" onClick={() => window.location.href = 'Parametres.html'}><I.Cog /></div>
      </div>
    </div>
  );
};

const CRMHeader = ({ theme, onToggleTheme, title, sub }) => {
  const [s, setS] = useState('');
  return (
    <div className="crm-header">
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', color: 'var(--fg1)', lineHeight: 1 }}>{title}</div>
        <div style={{ fontSize: '0.6875rem', color: 'var(--fg3)', marginTop: 2 }}>{sub}</div>
      </div>
      <div className="search-wrap"><span className="search-ico"><I.Srch /></span><input className="search-inp" placeholder="Rechercher…" value={s} onChange={(e) => setS(e.target.value)} /></div>
      <button className="btn-icon"><I.Bell /><span style={{ position: 'absolute', top: 3, right: 3, width: 6, height: 6, background: 'var(--red)', borderRadius: '50%', border: '1.5px solid var(--bg-base)' }}></span></button>
      <button className="btn-icon" onClick={onToggleTheme} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <I.Sun /> : <I.Moon />}</button>
      <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MC</div>
      <button className="btn-icon"><I.Cog /></button>
    </div>
  );
};

const Toggle = ({ on, onClick }) => (
  <div className="tgl" onClick={onClick} style={{ background: on ? 'var(--green)' : 'var(--bd-strong)' }}>
    <div className="tgl-knob" style={{ left: on ? 18 : 2 }}></div>
  </div>
);

/* ── AUTOMATION ROW ── */
const FlowChip = ({ kind, label, icon, color, bg, bd }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '0.4rem 0.7rem', borderRadius: 9, background: kind === 'when' ? 'var(--bg-muted)' : bg, border: `1px solid ${kind === 'when' ? 'var(--bd-solid)' : bd}`, minWidth: 0 }}>
    <span style={{ color: kind === 'when' ? 'var(--fg3)' : color, flexShrink: 0, display: 'flex' }}><Glyph name={icon} /></span>
    <div style={{ minWidth: 0 }}>
      <div className="lbl" style={{ color: kind === 'when' ? 'var(--fg4)' : color, marginBottom: 1 }}>{kind === 'when' ? 'Quand' : 'Alors'}</div>
      <div style={{ fontSize: '0.6875rem', fontWeight: 600, color: 'var(--fg1)', lineHeight: 1.25 }}>{label}</div>
    </div>
  </div>
);

const AutomationRow = ({ a, onToggle }) => {
  const cat = CATS[a.cat];
  return (
    <div className={`card auto-row`} style={{ padding: '0.875rem 1rem', opacity: a.active ? 1 : 0.72, borderLeft: a.ai ? '3px solid var(--violet)' : undefined }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 11 }}>
        <div style={{ width: 34, height: 34, borderRadius: 9, flexShrink: 0, background: cat.bg, border: `1px solid ${cat.bd}`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: cat.color }}>
          <Glyph name={a.icon} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            <span style={{ fontSize: '0.8125rem', fontWeight: 800, color: 'var(--fg1)' }}>{a.name}</span>
            {a.ai && <span style={{ fontSize: '0.5625rem', fontWeight: 700, color: 'var(--violet-fg)', background: 'var(--violet-m)', border: '1px solid var(--violet-b)', borderRadius: 999, padding: '1px 7px' }}>✦ IA</span>}
          </div>
          <div style={{ fontSize: '0.625rem', color: 'var(--fg3)', marginTop: 2 }}>{a.desc}</div>
        </div>
        <span style={{ fontSize: '0.5625rem', fontWeight: 700, padding: '2px 8px', borderRadius: 999, background: cat.bg, border: `1px solid ${cat.bd}`, color: cat.color, flexShrink: 0 }}>{cat.label}</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <span style={{ fontSize: '0.625rem', fontWeight: 600, color: a.active ? 'var(--green-fg)' : 'var(--fg4)', minWidth: 38, textAlign: 'right' }}>{a.active ? 'Active' : 'En pause'}</span>
          <Toggle on={a.active} onClick={() => onToggle(a.id)} />
        </div>
      </div>
      {/* Flow */}
      <div style={{ display: 'flex', alignItems: 'stretch', gap: 9, marginTop: 11, paddingLeft: 45 }}>
        <div style={{ flex: '1 1 0', minWidth: 0 }}><FlowChip kind="when" label={a.trigger} icon={a.icon} /></div>
        <div style={{ display: 'flex', alignItems: 'center', color: 'var(--fg4)', flexShrink: 0 }}><I.Arrow /></div>
        <div style={{ flex: '1 1 0', minWidth: 0 }}><FlowChip kind="then" label={a.action} icon={a.actionIc} color={cat.color} bg={cat.bg} bd={cat.bd} /></div>
      </div>
      {/* Footer */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 10, paddingLeft: 45 }}>
        <span style={{ fontSize: '0.5625rem', color: 'var(--fg4)', display: 'flex', alignItems: 'center', gap: 4 }}><I.Bolt />{a.runs} exécutions</span>
        <span style={{ fontSize: '0.5625rem', color: 'var(--fg4)', display: 'flex', alignItems: 'center', gap: 4 }}><I.Clock />Dernière : {a.last}</span>
        <span style={{ fontSize: '0.5625rem', color: 'var(--fg4)' }}>Succès : <b style={{ color: a.success >= 98 ? 'var(--green-fg)' : 'var(--yellow-fg)' }}>{a.success}%</b></span>
        <a href="Editeur Automatisation.html" className="btn-out" style={{ marginLeft: 'auto', padding: '0.25rem 0.7rem', fontSize: '0.625rem', textDecoration: 'none' }}>Modifier</a>
      </div>
    </div>
  );
};

const StatStrip = ({ autos }) => {
  const activeCount = autos.filter((a) => a.active).length;
  const totalRuns = autos.reduce((s, a) => s + a.runs, 0);
  const stats = [
    { l: 'Automatisations actives', v: `${activeCount}`, sub: `sur ${autos.length} configurées`, c: 'var(--fg1)' },
    { l: 'Exécutions ce mois', v: '348', sub: '+62 vs mois dernier', c: 'var(--fg1)' },
    { l: 'Temps économisé', v: '42 h', sub: 'estimé ce mois-ci', c: 'var(--green)' },
    { l: 'Taux de succès', v: '98,6%', sub: 'sur 30 jours', c: 'var(--fg1)' },
  ];
  return (
    <div className="hp-keep2" style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 8, padding: '0.875rem 1.125rem 0' }}>
      {stats.map((s) =>
        <div key={s.l} className="card" style={{ padding: '0.75rem 0.875rem' }}>
          <div className="lbl" style={{ marginBottom: 5 }}>{s.l}</div>
          <div style={{ fontSize: '1.25rem', fontWeight: 800, color: s.c, letterSpacing: '-0.03em', lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>{s.v}</div>
          <div style={{ fontSize: '0.5625rem', color: 'var(--fg4)', marginTop: 5 }}>{s.sub}</div>
        </div>
      )}
    </div>
  );
};

const TemplateCard = ({ t }) => {
  const cat = CATS[t.cat];
  return (
    <div className="card auto-row" style={{ padding: '0.875rem', display: 'flex', flexDirection: 'column', gap: 9 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
        <div style={{ width: 30, height: 30, borderRadius: 8, flexShrink: 0, background: cat.bg, border: `1px solid ${cat.bd}`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: cat.color }}><Glyph name={t.icon} /></div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: '0.75rem', fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6 }}>{t.name}{t.ai && <span style={{ fontSize: '0.5rem', fontWeight: 700, color: 'var(--violet-fg)', background: 'var(--violet-m)', border: '1px solid var(--violet-b)', borderRadius: 999, padding: '0 5px' }}>✦</span>}</div>
        </div>
      </div>
      <div style={{ fontSize: '0.625rem', color: 'var(--fg3)', lineHeight: 1.5, flex: 1 }}>{t.desc}</div>
      <button className="btn-out" style={{ width: '100%', justifyContent: 'center', padding: '0.4rem', fontSize: '0.6875rem' }}><I.Plus />Utiliser ce modèle</button>
    </div>
  );
};

const App = () => {
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('hp-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { return (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } });
  const [autos, setAutos] = useState(AUTOS0);
  const [tab, setTab] = useState('actives');
  const [fil, setFil] = useState('tous');
  useEffect(() => {
    const h = document.documentElement;
    h.setAttribute('data-theme-switching', '');
    h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500);
    return () => clearTimeout(t);
  }, [theme]);
  const toggleTheme = () => setTheme((t) => t === 'dark' ? 'light' : 'dark');
  const onToggle = (id) => setAutos((prev) => prev.map((a) => a.id === id ? { ...a, active: !a.active } : a));

  const activeCount = autos.filter((a) => a.active).length;
  const filters = [['tous', 'Toutes'], ['surveillance', 'Surveillance'], ['rapports', 'Rapports'], ['client', 'Cycle client'], ['facturation', 'Facturation'], ['ia', 'IA']];
  const shown = fil === 'tous' ? autos : autos.filter((a) => a.cat === fil);

  return (
    <div className="app-shell">
      <NavSidebar active="workflow" />
      <div className="main">
        <CRMHeader theme={theme} onToggleTheme={toggleTheme}
          title="Workflow & Automatisations"
          sub={`${activeCount} automatisations actives · 42 h économisées ce mois`} />

        {/* Toolbar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '0.75rem 1.125rem', borderBottom: '1px solid var(--bd-solid)', background: 'rgba(255,255,255,0.6)', backdropFilter: 'var(--blur)', flexShrink: 0 }}>
          <div style={{ display: 'flex', gap: 4, padding: 3, borderRadius: 999, background: 'var(--bg-muted)' }}>
            <button className={`tab${tab === 'actives' ? ' on' : ''}`} onClick={() => setTab('actives')} style={{ padding: '0.3rem 0.85rem' }}>Mes automatisations</button>
            <button className={`tab${tab === 'modeles' ? ' on' : ''}`} onClick={() => setTab('modeles')} style={{ padding: '0.3rem 0.85rem' }}>Modèles</button>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: '0.625rem', color: 'var(--fg4)', display: 'flex', alignItems: 'center', gap: 4 }}>
              <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--green)', display: 'inline-block' }}></span>
              Agent HuntPilot en service
            </span>
            <button className="btn-pri"><I.Plus />Créer une automatisation</button>
          </div>
        </div>

        {tab === 'actives' && <StatStrip autos={autos} />}

        <div className="sc" style={{ flex: 1, overflowY: 'auto', padding: '1rem 1.125rem 1.5rem' }}>
          {tab === 'actives'
            ? <React.Fragment>
                {/* Category filter */}
                <div style={{ display: 'flex', gap: 4, padding: 4, borderRadius: 999, background: 'var(--bg-muted)', width: 'fit-content', marginBottom: 14 }}>
                  {filters.map(([id, l]) => <button key={id} className={`tab${fil === id ? ' on' : ''}`} onClick={() => setFil(id)} style={{ fontSize: '0.6875rem', padding: '0.32rem 0.75rem' }}>{l}</button>)}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                  {shown.map((a) => <AutomationRow key={a.id} a={a} onToggle={onToggle} />)}
                </div>
              </React.Fragment>
            : <React.Fragment>
                <div style={{ fontSize: '0.8125rem', fontWeight: 800, marginBottom: 4 }}>Modèles prêts à l'emploi</div>
                <div style={{ fontSize: '0.6875rem', color: 'var(--fg3)', marginBottom: 14 }}>Ajoutez une automatisation en un clic, puis personnalisez-la.</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(248px,1fr))', gap: 10 }}>
                  {TEMPLATES.map((t, i) => <TemplateCard key={i} t={t} />)}
                </div>
              </React.Fragment>}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script type="text/babel" src="hp-search-data.jsx"></script>
<script type="text/babel" src="hp-notif-data.jsx"></script>
<script type="text/babel" src="hp-overlays.jsx"></script>
</body>
</html>
