<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HuntPilote — Citations et annuaires</title>
<script>(function(){var s=null;try{s=localStorage.getItem('hp-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hp-sidebar.jsx"></script>
<script type="text/babel" src="au-data.jsx"></script>
<script type="text/babel" src="lo-data.jsx"></script>
<script type="text/babel" src="lo-panels.jsx"></script>
<script type="text/babel" src="lo-citations-data.jsx"></script>
<script type="text/babel" src="lo-citations-panels.jsx"></script>
<link rel="stylesheet" href="hp-shell.css">
<link rel="stylesheet" href="hp-mobile.css">
<link rel="stylesheet" href="au-audit.css">
<link rel="stylesheet" href="to-shell.css">
<link rel="stylesheet" href="lo-audit.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { NavSidebar, AIco, ASec, APill } = window;
const { ESTABS, blocked, BlockingCard } = window;
const { REFERENCE_BY_ETAB, CITATIONS_BY_ETAB, CITATION_STATE_DEFS, AUTORITE_TIER, ReferenceCard, AnnuaireRow } = window;

const HI = {
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};
const readIdFromUrl = () => { try { return new URLSearchParams(window.location.search).get('id'); } catch { return null; } };
const ETAT_W = { doublon: 3, incoherent: 2, inaccessible: 1, absent: 0, conforme: -1 };

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [id, setId] = useState(() => readIdFromUrl() || 'acme-siege');
  const est = ESTABS.find(e => e.id === id) || ESTABS[0];
  const ref = REFERENCE_BY_ETAB[est.id];
  const rows = CITATIONS_BY_ETAB[est.id] || [];
  const [expanded, setExpanded] = useState(null);
  const [created, setCreated] = useState({});
  const [demo, setDemo] = useState('normal');

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const f = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', f); return () => mq.removeEventListener('change', f);
  }, []);
  useEffect(() => { setExpanded(null); setCreated({}); setDemo('normal'); }, [est.id]);
  const pickEst = newId => { setId(newId); try { history.replaceState(null, '', `Citations.html?id=${newId}`); } catch {} };

  const isBlocked = blocked(est);
  const sorted = useMemo(() => [...rows].sort((a, b) => (ETAT_W[b.etat] * 10 + AUTORITE_TIER[b.autorite]) - (ETAT_W[a.etat] * 10 + AUTORITE_TIER[a.autorite])), [rows]);
  const present = rows.filter(r => r.etat !== 'absent' && r.etat !== 'inaccessible').length;
  const incoh = rows.filter(r => r.etat === 'incoherent').length;
  const doublons = rows.filter(r => r.etat === 'doublon');
  const create = (name, kind) => setCreated(m => ({ ...m, [name]: `P-05${String(Object.keys(m).length + 1).padStart(2, '0')}` }));

  return (
    <div className="app-shell">
      <NavSidebar active="local" />
      <div className="main">
        <div className="crm-header">
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1 }}>Citations et annuaires — {est.name}</div>
            <div className="crumb"><a href="Dashboard.html">HuntPilote</a><span>›</span><a href="SEO Local.html">SEO local</a><span>›</span><a href={`Fiche Etablissement.html?id=${est.id}`}>{est.name}</a><span>›</span><b>Citations</b></div>
          </div>
          <button className="btn-icon" title="Notifications"><HI.Bell /></button>
          <button className="btn-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <HI.Sun /> : <HI.Moon />}</button>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MC</div>
        </div>

        <div className="subbar">
          <a href={`Fiche Etablissement.html?id=${est.id}`} className="btn-out" style={{ textDecoration: 'none' }}><AIco.Back />Fiche de l’établissement</a>
          <div className="ctx-g">
            <span className="lbl" style={{ marginBottom: 0 }}>Établissement</span>
            <select className="acct-sel" value={est.id} onChange={e => pickEst(e.target.value)} aria-label="Choisir un établissement">{ESTABS.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}</select>
          </div>
          {!isBlocked && <span style={{ fontSize: '0.625rem', color: 'var(--fg3)' }}>{present} annuaire{present > 1 ? 's' : ''} sur {rows.length} de référence · Seuil : {rows.length} sur {rows.length}</span>}
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl" style={{ marginBottom: 0 }}>Démo · état</span>
            <select className="state-sel" value={demo} onChange={e => setDemo(e.target.value)} aria-label="État de démonstration"><option value="normal">Analyse la plus récente</option><option value="jamais">Analyse jamais lancée</option><option value="encours">Analyse en cours</option></select>
          </div>
        </div>

        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          <div className="content">
            <div className="col-main">
              {isBlocked
                ? <BlockingCard est={est} />
                : demo === 'jamais'
                  ? <div className="card" style={{ padding: '1.25rem 1.125rem' }}><div className="empty" style={{ border: 'none', padding: 0 }}><div style={{ fontSize: '0.875rem', fontWeight: 800, marginBottom: 5 }}>Aucune analyse de citations n’a encore été lancée</div><div style={{ fontSize: '0.75rem', color: 'var(--fg2)', marginBottom: 10 }}>L’écran vérifiera {rows.length} annuaires de référence et comparera chacun à la fiche officielle du client.</div><button className="btn-pri"><AIco.Refresh />Lancer l’analyse</button></div></div>
                  : demo === 'encours'
                    ? <div className="card" style={{ padding: '1.25rem 1.125rem' }}><div className="empty" style={{ border: 'none', padding: 0 }}><div style={{ fontSize: '0.875rem', fontWeight: 800, marginBottom: 5 }}>Analyse en cours</div><div style={{ fontSize: '0.75rem', color: 'var(--fg2)' }}>7 annuaires vérifiés sur {rows.length}. Les résultats apparaîtront au fur et à mesure.</div></div></div>
                    : <React.Fragment>
                        {doublons.length > 0 && <div className="banner" data-tone="red"><span className="banner-ico"><AIco.Warn /></span><div style={{ flex: 1, minWidth: '14rem' }}><b>{doublons.length} doublon{doublons.length > 1 ? 's' : ''} de fiche détecté{doublons.length > 1 ? 's' : ''}.</b> C’est le problème le plus coûteux et le plus fréquent : deux fiches actives se concurrencent pour le même établissement et diluent son autorité locale.</div></div>}
                        <ASec title="Annuaires" sub="Triés par gravité et par autorité de la source — un annuaire à forte autorité pèse plus qu’un annuaire obscur">
                          {sorted.length === 0
                            ? <div className="empty">Aucun annuaire de référence pour cet établissement.</div>
                            : <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                {sorted.map(row => <AnnuaireRow key={row.annuaire} row={row} expanded={expanded === row.annuaire} onToggle={() => setExpanded(row.annuaire)}
                                  onCreatePrio={() => create(row.annuaire, 'prio')} onCreateTache={() => create(row.annuaire, 'tache')} created={created[row.annuaire]} />)}
                              </div>}
                        </ASec>
                      </React.Fragment>}
            </div>
            <div className="col-side">
              {!isBlocked && ref && <ReferenceCard info={ref} />}
              {!isBlocked && <ASec title="Ce qui compte le plus" sub="Rappel de hiérarchisation">
                <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.6 }}>Un numéro de téléphone périmé sur un annuaire à forte autorité compte plus qu’une virgule d’écart sur un annuaire obscur. Les doublons de fiche restent le problème le plus coûteux : ils divisent les avis et les citations d’un même établissement en deux identités concurrentes.</div>
              </ASec>}
            </div>
          </div>
        </div>
      </div>
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
