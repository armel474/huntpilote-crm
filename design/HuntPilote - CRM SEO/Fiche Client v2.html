*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

[data-theme-switching],[data-theme-switching] *,
[data-theme-switching] *::before,[data-theme-switching] *::after {
  transition: background-color 420ms ease, color 320ms ease,

}

body {
  font-family: var(--font); background: var(--bg-base); color: var(--fg1);
  -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh;
}
body::before, body::after {
  content: ''; position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(80px); opacity: 0.65;
}
body::before {
  width: 44rem; height: 44rem; top: -12rem; left: 12rem;
  background: radial-gradient(circle, rgba(74,222,128,0.40) 0%, transparent 68%);
}
body::after {
  width: 36rem; height: 36rem; bottom: -8rem; right: -2rem;
  background: radial-gradient(circle, rgba(229,198,107,0.36) 0%, transparent 68%);
}
[data-theme="dark"] body::before { opacity: 0.38; }
[data-theme="dark"] body::after  { opacity: 0.32; }

/* ── Shell ── */

.nav-sidebar {
  width: 58px; flex-shrink: 0;
  background: var(--bg-surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh;
  position: relative; isolation: isolate; overflow: visible;
}
.nav-sidebar::before {
  content: ''; position: absolute; inset: 0; z-index: -1;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.nav-cpt {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  margin: 0.1rem auto; cursor: pointer; transition: all 150ms;
  color: var(--fg3); position: relative;
}
.nav-cpt:hover { background: rgba(0,0,0,0.06); color: var(--fg1); }
[data-theme="dark"] .nav-cpt:hover { background: rgba(255,255,255,0.07); }
.nav-cpt.active { background: var(--primary); color: var(--primary-fg); }
.nav-cpt[data-label]:hover::after {
  content: attr(data-label);
  position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
  background: var(--fg1); color: var(--primary-fg);
  padding: 4px 10px; border-radius: 6px; font-size: 0.6875rem; font-weight: 500;
  white-space: nowrap; pointer-events: none; z-index: 400; font-family: var(--font);
}
[data-theme="dark"] .nav-cpt[data-label]:hover::after { background: var(--fg-2); color: var(--bg-base); }

/* Global header */
.crm-header {
  height: var(--header-h); flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.68);
  display: flex; align-items: center; padding: 0 1.125rem; gap: 0.625rem;
  position: relative; isolation: isolate;
  box-shadow: 0 1px 0 var(--border), 0 2px 20px rgba(0,0,0,0.05);
}
.crm-header::before {
  content: ''; position: absolute; inset: 0; z-index: -1;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
[data-theme="dark"] .crm-header { background: rgba(30,30,34,0.75); }

.btn-icon {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--bg-solid); border: 1px solid var(--bd-solid); color: var(--fg3);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 160ms; position: relative;
}
.btn-icon:hover { color: var(--fg1); }

.search-wrap { position: relative; display: flex; align-items: center; }
.search-ico  { position: absolute; left: 9px; color: var(--fg4); pointer-events: none; display: flex; }
.search-inp  {
  font-family: var(--font); font-size: 0.75rem; color: var(--fg1);
  background: var(--bg-solid); border: 1px solid var(--bd-solid);
  border-radius: 999px; padding: 0.35rem 0.75rem 0.35rem 28px;

.search-inp:focus { border-color: var(--accent); }
.search-inp::placeholder { color: var(--fg4); }
[data-theme="dark"] .search-inp { background: var(--bg-muted); }

.card { background: var(--bg-solid); border: 1px solid var(--bd-solid); border-radius: 14px; box-shadow: var(--shadow); }

.btn-out { display: inline-flex; align-items: center; gap: 5px; padding: 0.4rem 0.875rem; border-radius: 999px; background: transparent; color: var(--fg2); border: 1px solid var(--bd-strong); font-family: var(--font); font-size: 0.75rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 150ms; }
.btn-out:hover { background: var(--bg-muted); }
.btn-sm { display: inline-flex; align-items: center; gap: 4px; padding: 0.3rem 0.75rem; border-radius: 999px; border: 1px solid transparent; font-family: var(--font); font-size: 0.625rem; font-weight: 600; cursor: pointer; transition: opacity 150ms; }
.btn-sm:hover { opacity: 0.78; }
.tab { padding: 0.4rem 0.875rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; border: none; cursor: pointer; transition: all 140ms; font-family: var(--font); color: var(--fg2); background: transparent; white-space: nowrap; }
.tab.on { background: var(--bg-solid); color: var(--fg1); box-shadow: 0 1px 4px rgba(0,0,0,0.09); }
.lbl { font-size: 0.5625rem; font-weight: 700; color: var(--fg4); text-transform: uppercase; letter-spacing: 0.07em; }
.sc { overflow-y: auto; }
.sc::-webkit-scrollbar { width: 3px; }
.sc::-webkit-scrollbar-thumb { background: var(--bd-strong); border-radius: 999px; }
</style>

const Gauge = ({ v, sz = 84 }) => {
  const r = sz / 2 - 7,c = 2 * Math.PI * r;
  const col = v >= 85 ? 'var(--green)' : v >= 70 ? 'var(--yellow)' : 'var(--red)';
  return (
    <svg width={sz} height={sz} viewBox={`0 0 ${sz} ${sz}`}>
      <circle cx={sz / 2} cy={sz / 2} r={r} fill="none" stroke="var(--bg-muted)" strokeWidth="6" />

      strokeDasharray={`${v / 100 * c} ${c}`} strokeLinecap="round" transform={`rotate(-90 ${sz / 2} ${sz / 2})`} />
      <text x={sz / 2} y={sz / 2 - 2} textAnchor="middle" dominantBaseline="middle"

const MiniGauge = ({ score, label, sz = 68 }) => {

    </div>);

};
const Spark = ({ data, h = 60 }) => {
  const W = 400,mx = Math.max(...data),mn = Math.min(...data),rng = mx - mn || 1;
  const px = (i) => i / (data.length - 1) * W;
  const py = (vv) => h - 4 - (vv - mn) / rng * (h - 8);
  const pts = data.map((vv, i) => ({ x: px(i), y: py(vv) }));
  const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${W} ${h}`} preserveAspectRatio="none">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--green)" stopOpacity=".2" /><stop offset="100%" stopColor="var(--green)" stopOpacity="0" /></linearGradient></defs>
      <path d={`M0,${h} ${line.slice(1)} L${W},${h} Z`} fill="url(#sg)" />
      <path d={line} fill="none" stroke="var(--green)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length - 1].x} cy={pts[pts.length - 1].y} r="3.5" fill="var(--green)" />
    </svg>);

};

/* ── APP ── */
const App = () => {

  const [theme, setTheme] = useState(() => {
    try {return localStorage.getItem('hp-theme') || 'light';} catch {return 'light';}
  });

  useEffect(() => {
    const html = document.documentElement;
    html.setAttribute('data-theme-switching', '');
    html.setAttribute('data-theme', theme);
    try {localStorage.setItem('hp-theme', theme);} catch {}
    const t = setTimeout(() => html.removeAttribute('data-theme-switching'), 500);
    return () => clearTimeout(t);
  }, [theme]);

  const toggleTheme = () => setTheme((t) => t === 'dark' ? 'light' : 'dark');

  const critCount = PROBLEMS.filter((p) => p.sev === 'critique').length;
