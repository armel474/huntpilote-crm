<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuntPilot — Fiche Client</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
@font-face {
  font-family: 'Noto Sans';
  src: url('fonts/NotoSans-VariableFont_wdth_wght.ttf') format('truetype-variations');
  font-weight: 100 900; font-stretch: 62.5% 100%; font-style: normal; font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg-base: #F2EFEA;
  --bg-solid: #FFFFFF;
  --bg-muted: #E3DDD1;
  --bd: rgba(0,0,0,0.07);
  --bd-solid: #D0CBBF;
  --bd-strong: #BAB4A6;
  --fg1: #18181B; --fg2: #3F3F46; --fg3: #71717A; --fg4: #A1A1AA;
  --primary: #1F1F1F; --primary-fg: #FFFFFF;
  --green: #16A34A; --green-m: #DCEFD4; --green-b: #BBE3AA; --green-fg: #2D5A27;
  --yellow: #E5C66B; --yellow-m: #F5E8B5; --yellow-fg: #7A5D14; --yellow-b: #D4B24A;
  --blue: #3B82F6; --blue-m: #DBEAFE; --blue-fg: #1D4ED8; --blue-b: #93C5FD;
  --red: #C44545;
  --shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 20px -2px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.05);
}
body { font-family: var(--font); background: var(--bg-base); color: var(--fg1); -webkit-font-smoothing: antialiased; }

/* Utilities */
.card { background: var(--bg-solid); border: 1px solid var(--bd-solid); border-radius: 14px; box-shadow: var(--shadow); }
.btn-pri { display: inline-flex; align-items: center; gap: 6px; padding: 0.45rem 1rem; border-radius: 999px; background: var(--primary); color: var(--primary-fg); border: none; font-family: var(--font); font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 150ms; }
.btn-pri:hover { opacity: 0.84; }
.btn-out { display: inline-flex; align-items: center; gap: 5px; padding: 0.4rem 0.875rem; border-radius: 999px; background: transparent; color: var(--fg2); border: 1px solid var(--bd-strong); font-family: var(--font); font-size: 0.75rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 150ms; }
.btn-out:hover { background: var(--bg-muted); }
.btn-green { display: inline-flex; align-items: center; gap: 6px; padding: 0.45rem 1rem; border-radius: 999px; background: var(--green); color: #fff; border: none; font-family: var(--font); font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: opacity 150ms; }
.btn-green:hover { opacity: 0.88; }
.tab { padding: 0.4rem 0.875rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; border: none; cursor: pointer; transition: all 140ms; font-family: var(--font); color: var(--fg4); background: transparent; }
.tab.on { background: var(--bg-solid); color: var(--fg1); box-shadow: 0 1px 4px rgba(0,0,0,0.09); }
.ptrack { height: 4px; background: rgba(0,0,0,0.08); border-radius: 999px; overflow: hidden; }
.pfill  { height: 100%; border-radius: 999px; background: var(--green); }
.lbl { font-size: 0.5625rem; font-weight: 700; color: var(--fg4); text-transform: uppercase; letter-spacing: 0.07em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { DesignCanvas, DCSection, DCArtboard } = window;

/* ── DATA ── */
const CL = {

  {name:'Création 5 articles blog',due:'15 juin',status:'À faire',t:'blue'},
  {name:'Audit backlinks concurrents',due:'10 mai',status:'Terminé',t:'green'},

const ACT = [
  {label:'Rapport mensuel envoyé',date:'1 mai',ic:'doc'},
  {label:'Audit Q2 lancé',date:'14 avr.',ic:'zap'},
  {label:'12 nouveaux backlinks',date:'8 avr.',ic:'link'},
  {label:'MRR renouvelé',date:'1 avr.',ic:'check'},

const SPARK = [28,32,30,35,38,34,40,43,41,48,52,49,55,58,62,64,68,66,72,75];

/* ── ICONS ── */
const I = {
  Mail:  ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
  Phone: ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.01 1.21 2 2 0 012 0h3a2 2 0 012 1.72c.167.96.391 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.309 1.85.533 2.81.7A2 2 0 0122 14.92v2z"/></svg>,
  Globe: ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>,
  Pin:   ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>,
  User:  ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
  Cal:   ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  Check: ()=><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Up:    ()=><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="18 15 12 9 6 15"/></svg>,
  Down:  ()=><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>,
  Plus:  ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  Zap:   ()=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
  Srch:  ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  Link:  ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>,
  Doc:   ()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
  More:  ()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>,
  Chev:  ()=><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>,
};

/* ── ATOMS ── */
const Av = ({s=50,r=12})=>(
  <div style={{width:s,height:s,borderRadius:r,flexShrink:0,background:'linear-gradient(140deg,#d4edda,#e3ddd1)',border:'1.5px solid var(--bd-solid)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:s*.29,fontWeight:800,color:'var(--green-fg)',letterSpacing:'-0.02em'}}>AC</div>
);

const Bdg = ({label,t='green',lg})=>{
  const M={green:['var(--green-m)','var(--green-b)','var(--green-fg)'],yellow:['var(--yellow-m)','var(--yellow-b)','var(--yellow-fg)'],blue:['var(--blue-m)','var(--blue-b)','var(--blue-fg)'],neutral:['var(--bg-muted)','var(--bd-solid)','var(--fg3)']}[t]||['var(--bg-muted)','var(--bd-solid)','var(--fg3)'];
  return <span style={{background:M[0],border:`1px solid ${M[1]}`,color:M[2],padding:lg?'3px 11px':'2px 7px',borderRadius:999,fontSize:lg?'0.6875rem':'0.5625rem',fontWeight:700,letterSpacing:'0.03em',whiteSpace:'nowrap'}}>{label}</span>;
};

const Gauge = ({v,sz=84})=>{
  const r=sz/2-7, c=2*Math.PI*r;
  const col=v>=85?'var(--green)':v>=70?'var(--yellow)':'var(--red)';
  return(
    <svg width={sz} height={sz} viewBox={`0 0 ${sz} ${sz}`}>
      <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke="var(--bg-muted)" strokeWidth="6"/>
      <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={col} strokeWidth="6"
        strokeDasharray={`${(v/100)*c} ${c}`} strokeLinecap="round"
        transform={`rotate(-90 ${sz/2} ${sz/2})`}/>
      <text x={sz/2} y={sz/2-2} textAnchor="middle" dominantBaseline="middle"
        style={{fontFamily:'var(--font)',fontSize:sz*.235,fontWeight:800,fill:col}}>{v}</text>
      <text x={sz/2} y={sz/2+sz*.2} textAnchor="middle"
        style={{fontFamily:'var(--font)',fontSize:sz*.115,fill:'var(--fg4)'}}>/100</text>
    </svg>
  );
};

const Spark = ({data,h=60})=>{
  const W=400,mx=Math.max(...data),mn=Math.min(...data),rng=mx-mn||1;
  const px=i=>(i/(data.length-1))*W;
  const py=vv=>h-4-((vv-mn)/rng)*(h-8);
  const pts=data.map((vv,i)=>({x:px(i),y:py(vv)}));
  const line=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return(
    <svg width="100%" height={h} viewBox={`0 0 ${W} ${h}`} preserveAspectRatio="none">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--green)" stopOpacity=".2"/><stop offset="100%" stopColor="var(--green)" stopOpacity="0"/></linearGradient></defs>
      <path d={`M0,${h} ${line.slice(1)} L${W},${h} Z`} fill="url(#sg)"/>
      <path d={line} fill="none" stroke="var(--green)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={pts[pts.length-1].x} cy={pts[pts.length-1].y} r="3.5" fill="var(--green)"/>
    </svg>
  );
};

const Delta = ({d})=>(
  <span style={{display:'flex',alignItems:'center',gap:1,fontSize:'0.625rem',fontWeight:600,color:d>0?'var(--green)':d<0?'var(--red)':'var(--fg4)'}}>
    {d>0?<I.Up/>:d<0?<I.Down/>:'—'}{d!==0&&Math.abs(d)}
  </span>
);

const STag = ({status,t})=>{
  const M={green:['var(--green-m)','var(--green-b)','var(--green-fg)'],yellow:['var(--yellow-m)','var(--yellow-b)','var(--yellow-fg)'],blue:['var(--blue-m)','var(--blue-b)','var(--blue-fg)']}[t]||['var(--bg-muted)','var(--bd-solid)','var(--fg3)'];
  return <span style={{background:M[0],border:`1px solid ${M[1]}`,color:M[2],padding:'2px 8px',borderRadius:999,fontSize:'0.5625rem',fontWeight:700,whiteSpace:'nowrap'}}>{status}</span>;
};

const Feed = ({items})=>(
  <div>{items.map((a,i)=>(
    <div key={i} style={{display:'flex',gap:8,marginBottom:10,alignItems:'flex-start'}}>
      <div style={{width:24,height:24,borderRadius:6,background:'var(--bg-muted)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'var(--fg3)'}}>
        {a.ic==='zap'?<I.Zap/>:a.ic==='link'?<I.Link/>:a.ic==='doc'?<I.Doc/>:<I.Check/>}
      </div>
      <div>
        <div style={{fontSize:'0.6875rem',color:'var(--fg2)',lineHeight:1.35,fontWeight:500}}>{a.label}</div>
        <div style={{fontSize:'0.5625rem',color:'var(--fg4)',marginTop:1}}>{a.date}</div>
      </div>
    </div>
  ))}</div>
);

const CRow = ({ico,val})=>(
  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:6,color:'var(--fg3)',fontSize:'0.75rem'}}>
    <span style={{color:'var(--fg4)',flexShrink:0}}>{ico}</span>{val}
  </div>
);

const InfoRow = ({ico,label,val})=>(
  <div style={{display:'flex',gap:7,marginBottom:9,alignItems:'flex-start'}}>
    <span style={{color:'var(--fg4)',flexShrink:0,marginTop:1}}>{ico}</span>
    <div>
      <div className="lbl" style={{marginBottom:2}}>{label}</div>
      <div style={{fontSize:'0.75rem',color:'var(--fg1)',fontWeight:600}}>{val}</div>
    </div>
  </div>
);

const SvcChips = ()=>(
  <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
    {CL.services.map(s=><span key={s} style={{fontSize:'0.625rem',fontWeight:600,padding:'3px 9px',borderRadius:999,background:'var(--bg-muted)',color:'var(--fg2)',border:'1px solid var(--bd-solid)'}}>{s}</span>)}
  </div>
);

/* ── SHARED TAB PANELS ── */
const PanelApercu = ({big})=>(
  <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
      {KPIS.map(k=>(
        <div key={k.l} className="card" style={{padding:big?'1rem 1.125rem':'0.75rem 0.875rem'}}>
          <div className="lbl" style={{marginBottom:4}}>{k.l}</div>
          <div style={{fontSize:big?'1.5rem':'1.125rem',fontWeight:800,color:'var(--fg1)',fontVariantNumeric:'tabular-nums',letterSpacing:'-0.03em',lineHeight:1}}>{k.v}</div>
          <div style={{display:'flex',alignItems:'center',gap:2,marginTop:5,fontSize:'0.6rem',color:'var(--green)',fontWeight:600}}><I.Up/>{k.sub}</div>
        </div>
      ))}
    </div>
    <div className="card" style={{padding:'0.875rem 1rem',marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div>
          <div style={{fontSize:'0.8125rem',fontWeight:700}}>Trafic organique</div>
          <div style={{fontSize:'0.625rem',color:'var(--fg4)'}}>Sessions · 20 semaines</div>
        </div>
        <span style={{fontSize:'1.5rem',fontWeight:800,color:'var(--green)',letterSpacing:'-0.03em',fontVariantNumeric:'tabular-nums'}}>+72%</span>
      </div>
      <Spark data={SPARK} h={big?72:56}/>
    </div>
    <div className="card" style={{padding:'0.875rem 1rem'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:'0.8125rem',fontWeight:700}}>Top Mots-clés</div>
        <span style={{fontSize:'0.625rem',color:'var(--fg4)'}}>142 positions totales</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 58px 68px 38px',gap:'0 10px'}}>
        {['Mot-clé','Position','Vol./m','Δ 30j'].map(h=>(
          <div key={h} className="lbl" style={{paddingBottom:5,borderBottom:'1px solid var(--bd-solid)'}}>{h}</div>
        ))}
        {KW.map(k=>(
          <React.Fragment key={k.kw}>
            <div style={{fontSize:'0.75rem',padding:'5px 0',borderBottom:'1px solid var(--bd)',fontWeight:500}}>{k.kw}</div>
            <div style={{fontSize:'0.75rem',padding:'5px 0',borderBottom:'1px solid var(--bd)',fontVariantNumeric:'tabular-nums',fontWeight:700,color:k.pos<=3?'var(--green)':k.pos<=10?'var(--yellow-fg)':'var(--fg2)'}}>#{k.pos}</div>
            <div style={{fontSize:'0.75rem',color:'var(--fg3)',padding:'5px 0',borderBottom:'1px solid var(--bd)',fontVariantNumeric:'tabular-nums'}}>{k.vol}</div>
            <div style={{padding:'5px 0',borderBottom:'1px solid var(--bd)',display:'flex',alignItems:'center'}}><Delta d={k.d}/></div>
          </React.Fragment>
        ))}
      </div>
    </div>
  </div>
);

const PanelTaches = ()=>(
  <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div style={{fontSize:'0.8125rem',fontWeight:700}}>Tâches du client</div>
      <button className="btn-pri"><I.Plus/>Ajouter</button>
    </div>
    {TASKS.map((t,i)=>(
      <div key={i} className="card" style={{display:'flex',alignItems:'center',gap:10,padding:'0.75rem 1rem',marginBottom:7}}>
        <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${t.t==='green'?'var(--green)':'var(--bd-strong)'}`,flexShrink:0,background:t.t==='green'?'var(--green)':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
          {t.t==='green'&&<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
        </div>
        <div style={{flex:1,fontSize:'0.8125rem',fontWeight:500,color:t.t==='green'?'var(--fg4)':'var(--fg1)',textDecoration:t.t==='green'?'line-through':'none'}}>{t.name}</div>
        <div style={{fontSize:'0.625rem',color:'var(--fg4)'}}>{t.due}</div>
        <STag status={t.status} t={t.t}/>
      </div>
    ))}
  </div>
);

const PanelAudits = ()=>(
  <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div style={{fontSize:'0.8125rem',fontWeight:700}}>Historique des audits</div>
      <button className="btn-pri"><I.Zap/>Lancer un Audit</button>
    </div>
    {AUDITS.map((a,i)=>(
      <div key={i} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'0.875rem 1rem',marginBottom:7}}>
        <div style={{width:38,height:38,borderRadius:10,background:'var(--bg-muted)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--fg3)',flexShrink:0}}><I.Srch/></div>
        <div style={{flex:1}}>
          <div style={{fontSize:'0.8125rem',fontWeight:700,color:'var(--fg1)'}}>{a.name}</div>
          <div style={{fontSize:'0.625rem',color:'var(--fg4)',marginTop:2}}>{a.date}</div>
