<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HuntPilote — Keyword Gap</title>
<script>(function(){var s=null;try{s=localStorage.getItem('hp-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hp-sidebar.jsx"></script>
<script type="text/babel" src="au-data.jsx"></script>
<script type="text/babel" src="au-panels.jsx"></script>
<script type="text/babel" src="to-panels.jsx"></script>
<script type="text/babel" src="to-results.jsx"></script>
<script type="text/babel" src="kg-data.jsx"></script>
<script type="text/babel" src="kg-panels.jsx"></script>
<link rel="stylesheet" href="hp-shell.css">
<link rel="stylesheet" href="hp-mobile.css">
<link rel="stylesheet" href="au-audit.css">
<link rel="stylesheet" href="to-shell.css">
<link rel="stylesheet" href="kg-audit.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { NavSidebar, AIco, APill, TI, KGI, TOOL_ACCOUNTS, readLastAcct, writeLastAcct, ContextBar, Banner, SavesCard, CompManage, CatGroup, GapKeepCard, CLIENT, DEFAULT_COMPETITORS, CATS, ROWS, KG_SAVES } = window;

const HI = {
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.79" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};

const KG_STATES = [['ok', 'Résultats disponibles'], ['aucun', 'Aucun concurrent renseigné'], ['sansdonnees', 'Concurrent sans données'], ['recoupement', 'Recoupement nul'], ['nosel', 'Aucun compte sélectionné'], ['prospect', 'Prospect · instantané']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [state, setState] = useState('ok');
  const [acctId, setAcctId] = useState(() => readLastAcct() || 'acme');
  const [filter, setFilter] = useState('tous');
  const [domain, setDomain] = useState('');
  const [competitors, setCompetitors] = useState(DEFAULT_COMPETITORS);
  const [open, setOpen] = useState({ manquants: true, faibles: true, forts: false, uniques: false });
  const [created, setCreated] = useState({});
  const [tracked, setTracked] = useState(0);
  const [saved, setSaved] = useState(false);
  const selRef = useRef(null);

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const fn = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', fn); return () => mq.removeEventListener('change', fn);
  }, []);

  const acct = TOOL_ACCOUNTS.find(a => a.id === acctId) || null;
  useEffect(() => { setDomain(acct ? acct.domain : ''); setSaved(false); }, [acctId]);

  const pickState = s => {
    setState(s); setSaved(false); setCreated({}); setTracked(0);
    if (s === 'aucun') setCompetitors([]);
    else if (s === 'sansdonnees') setCompetitors(DEFAULT_COMPETITORS.map((c, i) => i === 1 ? { ...c, noData: true } : c));
    else setCompetitors(DEFAULT_COMPETITORS);
    if (s === 'nosel') setAcctId('');
    else if (s === 'prospect') setAcctId('nordik');
    else setAcctId(readLastAcct() || 'acme');
  };
  const pickAcct = id => {
    setAcctId(id); setSaved(false);
    if (id) { writeLastAcct(id); if (state === 'nosel') setState('ok'); } else setState('nosel');
  };
  const removeComp = d => setCompetitors(cs => cs.filter(c => c.domain !== d));
  const addComp = d => competitors.length < 3 && setCompetitors(cs => [...cs, { domain: d, name: d }]);
  const create = c => setCreated(m => ({ ...m, [c]: `P-05${String(Object.keys(m).length + 1).padStart(2, '0')}` }));
  const track = () => setTracked(t => t + 1);

  const recoupementNul = state === 'recoupement';
  const cats = CATS.map(cat => ({ cat, rows: recoupementNul ? [] : ROWS[cat.id] }));
  const totalRows = cats.reduce((n, g) => n + g.rows.length, 0);
  const prospect = !!acct && acct.type === 'prospect';
  const bannerKind = prospect ? 'prospect' : !acct ? 'nosel' : null;
  const canSave = !!acct && competitors.length > 0 && state !== 'aucun';
  const nCreated = Object.keys(created).length;

  return (
    <div className="app-shell">
      <NavSidebar active="outil" activeTool="Keyword Gap" />
      <div className="main">
        <div className="crm-header">
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1 }}>Keyword Gap</div>
            <div className="crumb"><a href="Dashboard.html">HuntPilote</a><span>›</span><a href="Cadre Outils.html">Outils</a><span>›</span><b>Keyword Gap</b>{acct && <><span>›</span><span>{acct.name}</span></>}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl" style={{ marginBottom: 0 }}>Démo · état</span>
            <select className="state-sel" value={state} onChange={e => pickState(e.target.value)} aria-label="État de démonstration">{KG_STATES.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
          </div>
          <button className="btn-icon" title="Notifications"><HI.Bell /></button>
          <button className="btn-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <HI.Sun /> : <HI.Moon />}</button>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MB</div>
        </div>

        <ContextBar acct={acct} onAcct={pickAcct} filter={filter} onFilter={setFilter} domain={domain} onDomain={setDomain}
          period="Comparaison" onPeriod={() => {}} periods={['Comparaison']} periodLabel="Comparaison"
          costText={`${competitors.length} concurrent${competitors.length > 1 ? 's' : ''} comparé${competitors.length > 1 ? 's' : ''}`} costTitle="Nombre de concurrents inclus dans la comparaison"
          saved={saved} onSave={() => setSaved(true)} canSave={canSave} saveHint="Renseignez au moins un concurrent" selRef={selRef} />

        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          {(bannerKind || (state === 'sansdonnees' && competitors.some(c => c.noData)) || nCreated > 0 || tracked > 0) && (
            <div style={{ padding: '0.75rem 1.125rem 0', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {bannerKind && <Banner kind={bannerKind} onFocusAcct={() => selRef.current && selRef.current.focus()} />}
              {state === 'sansdonnees' && !bannerKind && competitors.filter(c => c.noData).map(c => (
                <div className="banner" data-tone="yellow" key={c.domain}>
                  <span className="banner-ico"><AIco.Warn /></span>
                  <div style={{ flex: 1, minWidth: '14rem' }}><b>{c.name} n’a renvoyé aucune donnée.</b> Le fournisseur n’a pas pu analyser ce domaine — vérifiez qu’il est bien orthographié, ou réessayez plus tard. Les autres colonnes restent fiables.</div>
                </div>))}
              {nCreated > 0 && <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}><APill label={`${nCreated} priorité${nCreated > 1 ? 's' : ''} créée${nCreated > 1 ? 's' : ''} depuis cet outil`} tone="blue" sm icon={<AIco.Plus />} /><a href="Fiche Client v4.html" style={{ fontSize: '0.625rem', color: 'var(--fg3)' }}>Voir le plan d’action</a></div>}
              {tracked > 0 && <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}><APill label={`${tracked} mot${tracked > 1 ? 's' : ''}-clé${tracked > 1 ? 's' : ''} ajouté${tracked > 1 ? 's' : ''} au suivi`} tone="blue" sm icon={<AIco.Plus />} /><a href="Position Tracking.html" style={{ fontSize: '0.625rem', color: 'var(--fg3)' }}>Voir le suivi</a></div>}
            </div>)}

          <div className="content">
            <div className="col-main">
              {!acct && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.875rem', fontWeight: 800, marginBottom: 5 }}>Choisissez un compte pour le comparer</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.5, maxWidth: '30rem', margin: '0 auto 11px' }}>Le compte fournit le domaine client et reçoit la mise à jour de la carte Concurrence.</div>
                    <button className="btn-out" onClick={() => selRef.current && selRef.current.focus()}>Choisir un compte</button>
                  </div>
                </div>)}

              {acct && <CompManage competitors={competitors} onRemove={removeComp} onAdd={addComp} />}

              {acct && competitors.length === 0 && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.9375rem', fontWeight: 800, marginBottom: 5 }}>Aucun concurrent renseigné</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.55, maxWidth: '30rem', margin: '0 auto' }}>Ajoutez jusqu’à trois domaines concurrents ci-dessus pour voir les requêtes manquantes, faibles, fortes et uniques.</div>
                  </div>
                </div>)}

              {acct && competitors.length > 0 && recoupementNul && (
                <div className="empty">
                  <div style={{ fontSize: '0.8125rem', fontWeight: 800, marginBottom: 4 }}>Recoupement nul</div>
                  <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.5 }}>Aucune requête commune entre {CLIENT.name} et les concurrents comparés — les thématiques ne se recoupent pas assez pour être comparées utilement.</div>
                </div>)}

              {acct && competitors.length > 0 && !recoupementNul && totalRows > 0 && cats.map(({ cat, rows }) => rows.length > 0 && (
                <CatGroup key={cat.id} cat={cat} rows={rows} competitors={competitors} open={!!open[cat.id]}
                  onToggle={() => setOpen(o => ({ ...o, [cat.id]: !o[cat.id] }))} created={created} onCreate={create} onTrack={track} />
              ))}
            </div>
            <div className="col-side">
              <GapKeepCard prospect={prospect} />
              <SavesCard acct={acct} justSaved={saved} prospect={prospect} items={KG_SAVES} toolName="Keyword Gap" savedWhat={`${competitors.length} concurrents comparés`} />
            </div>
          </div>
        </div>
      </div>
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
