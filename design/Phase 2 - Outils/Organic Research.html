<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HuntPilote — Organic Research</title>
<script>(function(){var s=null;try{s=localStorage.getItem('hp-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hp-sidebar.jsx"></script>
<script type="text/babel" src="au-data.jsx"></script>
<script type="text/babel" src="au-panels.jsx"></script>
<script type="text/babel" src="to-panels.jsx"></script>
<script type="text/babel" src="to-results.jsx"></script>
<script type="text/babel" src="or-data.jsx"></script>
<script type="text/babel" src="or-panels.jsx"></script>
<link rel="stylesheet" href="hp-shell.css">
<link rel="stylesheet" href="hp-mobile.css">
<link rel="stylesheet" href="au-audit.css">
<link rel="stylesheet" href="to-shell.css">
<link rel="stylesheet" href="or-audit.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const { NavSidebar, AIco, APill, TI, ORI, TOOL_ACCOUNTS, readLastAcct, writeLastAcct, ContextBar, Banner, SavesCard, EvolutionCard, QueriesTable, PagesCard, PotentialCard, OrKeepCard, OR_TRAFFIC, OR_POS, OR_TRAFFIC_OK, OR_POS_OK, OR_DROP, QUERIES, PAGES_UP, PAGES_DOWN, POTENTIAL_ROWS, CTR_MULT, OR_SAVES } = window;

const HI = {
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.79" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};

const OR_STATES = [['ok', 'Résultats disponibles'], ['chute', 'Chute brutale détectée'], ['quota', 'Quota insuffisant pour l’analyse profonde'], ['pipeline', 'Prospect déjà au pipeline'], ['nosel', 'Aucun compte sélectionné'], ['prospect', 'Prospect · instantané']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [state, setState] = useState('chute');
  const [acctId, setAcctId] = useState('nordik');
  const [filter, setFilter] = useState('prospects');
  const [domain, setDomain] = useState('spanordik-estrie.ca');
  const [q, setQ] = useState('');
  const [generated, setGenerated] = useState(false);
  const [saved, setSaved] = useState(false);
  const selRef = useRef(null);

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const fn = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', fn); return () => mq.removeEventListener('change', fn);
  }, []);

  const acct = TOOL_ACCOUNTS.find(a => a.id === acctId) || null;
  useEffect(() => { setDomain(acct ? acct.domain : ''); setSaved(false); }, [acctId]);

  const pickState = s => {
    setState(s); setSaved(false); setGenerated(false); setQ('');
    if (s === 'nosel') setAcctId('');
    else setAcctId(readLastAcct() || 'nordik');
  };
  const pickAcct = id => {
    setAcctId(id); setSaved(false);
    if (id) { writeLastAcct(id); if (state === 'nosel') setState('chute'); } else setState('nosel');
  };

  const chute = state === 'chute';
  const quotaBas = state === 'quota';
  const alreadyPipeline = !!acct && acct.type === 'prospect' && domain === acct.domain;
  const term = q.trim().toLowerCase();
  const rows = useMemo(() => QUERIES.filter(r => !term || r.c.toLowerCase().includes(term)), [term]);
  const prospect = !!acct && acct.type === 'prospect';
  const bannerKind = prospect ? 'prospect' : !acct ? 'nosel' : null;
  const canSave = !!acct && state !== 'nosel' && !quotaBas;

  return (
    <div className="app-shell">
      <NavSidebar active="outil" activeTool="Organic Research" />
      <div className="main">
        <div className="crm-header">
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1 }}>Organic Research</div>
            <div className="crumb"><a href="Dashboard.html">HuntPilote</a><span>›</span><a href="Cadre Outils.html">Outils</a><span>›</span><b>Organic Research</b>{acct && <><span>›</span><span>{acct.name}</span></>}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl" style={{ marginBottom: 0 }}>Démo · état</span>
            <select className="state-sel" value={state} onChange={e => pickState(e.target.value)} aria-label="État de démonstration">{OR_STATES.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
          </div>
          <button className="btn-icon" title="Notifications"><HI.Bell /></button>
          <button className="btn-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <HI.Sun /> : <HI.Moon />}</button>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MB</div>
        </div>

        <ContextBar acct={acct} onAcct={pickAcct} filter={filter} onFilter={setFilter} domain={domain} onDomain={setDomain}
          period="12–24 mois" onPeriod={() => {}} periods={['12–24 mois']} periodLabel="Période d’analyse"
          cost={{ credits: 62, dollars: '0,31 $' }}
          action={generated
            ? <a href="Audit Prospect.html" style={{ textDecoration: 'none' }}><span className="btn-out"><AIco.Check />Audit généré · voir le document</span></a>
            : <button className="btn-go" onClick={() => setGenerated(true)} disabled={!canSave} title={canSave ? 'Produit un document partageable, plus léger que le rapport mensuel' : 'Choisissez un compte pour générer l’audit'}><ORI.Doc />Générer un audit de prospect</button>}
          selRef={selRef} />

        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          {(bannerKind || alreadyPipeline || quotaBas) && (
            <div style={{ padding: '0.75rem 1.125rem 0', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {bannerKind && <Banner kind={bannerKind} quota={{ used: 8240, max: 10000 }} onFocusAcct={() => selRef.current && selRef.current.focus()} />}
              {alreadyPipeline && !bannerKind && <div className="banner" data-tone="blue"><span className="banner-ico"><AIco.Check /></span><div style={{ flex: 1, minWidth: '14rem' }}><b>{acct.name} est déjà au pipeline</b> — {acct.plan}. Cette analyse approfondie nourrit directement la proposition en cours.</div><div className="banner-act"><a href="Pipeline.html" className="btn-out" style={{ textDecoration: 'none' }}>Voir le pipeline</a></div></div>}
              {quotaBas && (
                <div className="banner" data-tone="yellow">
                  <span className="banner-ico"><ORI.Coin /></span>
                  <div style={{ flex: 1, minWidth: '14rem' }}><b>Quota insuffisant pour l’analyse profonde ce mois-ci.</b> L’aperçu ci-dessous reste disponible, mais l’historique complet sur 24 mois et le potentiel chiffré demandent plus de crédits que ceux restants.</div>
                  <div className="banner-act"><a href="Parametres.html" className="btn-out" style={{ textDecoration: 'none' }}>Voir la consommation</a></div>
                </div>)}
            </div>)}

          <div className="content">
            <div className="col-main">
              {!acct && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.875rem', fontWeight: 800, marginBottom: 5 }}>Choisissez un compte à explorer en profondeur</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.5, maxWidth: '30rem', margin: '0 auto 11px' }}>Idéal après un Domain Overview prometteur, avant de chiffrer une proposition.</div>
                    <button className="btn-out" onClick={() => selRef.current && selRef.current.focus()}>Choisir un compte</button>
                  </div>
                </div>)}

              {acct && (
                <EvolutionCard traffic={chute ? OR_TRAFFIC : OR_TRAFFIC_OK} pos={chute ? OR_POS : OR_POS_OK} drop={chute ? OR_DROP : null} months={24} />)}

              {acct && !quotaBas && (<>
                <PotentialCard rows={POTENTIAL_ROWS} mult={CTR_MULT} />
                <QueriesTable rows={rows} q={q} onQ={setQ} />
                <PagesCard up={PAGES_UP} down={PAGES_DOWN} />
              </>)}

              {acct && quotaBas && (
                <div className="empty">
                  <div style={{ fontSize: '0.8125rem', fontWeight: 800, marginBottom: 4 }}>Le détail des requêtes et le potentiel chiffré demandent un quota plus large</div>
                  <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.5 }}>Revenez au renouvellement mensuel, ou limitez l’analyse à Domain Overview pour ce prospect en attendant.</div>
                </div>)}
            </div>
            <div className="col-side">
              <OrKeepCard prospect={prospect} />
              <SavesCard acct={acct} justSaved={saved} prospect={prospect} items={OR_SAVES} toolName="Organic Research" savedWhat="Audit de prospect généré" />
            </div>
          </div>
        </div>
      </div>
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
