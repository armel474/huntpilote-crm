<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HuntPilote — Position Tracking</title>
<script>(function(){var s=null;try{s=localStorage.getItem('hp-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hp-sidebar.jsx"></script>
<script type="text/babel" src="au-data.jsx"></script>
<script type="text/babel" src="au-panels.jsx"></script>
<script type="text/babel" src="to-panels.jsx"></script>
<script type="text/babel" src="to-results.jsx"></script>
<script type="text/babel" src="pt-data.jsx"></script>
<script type="text/babel" src="pt-panels.jsx"></script>
<link rel="stylesheet" href="hp-shell.css">
<link rel="stylesheet" href="hp-mobile.css">
<link rel="stylesheet" href="au-audit.css">
<link rel="stylesheet" href="to-shell.css">
<link rel="stylesheet" href="pt-audit.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const { NavSidebar, AIco, APill, TI, PTI, TOOL_ACCOUNTS, readLastAcct, writeLastAcct, ContextBar, Banner, SavesCard, MoversCard, DistributionCard, TrendCard, KeywordTable, PlanCard, PtKeepCard, KEYWORDS, PT_PERIODS, PT_THRESHOLD, PT_SAVES } = window;

const HI = {
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};

const PT_STATES = [['ok', 'Résultats disponibles'], ['vide', 'Aucun mot-clé suivi'], ['premier', 'Premier relevé · rien à comparer'], ['encours', 'Relevé hebdomadaire en cours'], ['sorti', 'Mot-clé sorti du classement'], ['cannib', 'Cannibalisation détectée'], ['nosel', 'Aucun compte sélectionné'], ['prospect', 'Prospect · instantané']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [state, setState] = useState('ok');
  const [acctId, setAcctId] = useState(() => readLastAcct() || 'acme');
  const [filter, setFilter] = useState('tous');
  const [period, setPeriod] = useState(PT_PERIODS[0]);
  const [domain, setDomain] = useState('');
  const [q, setQ] = useState('');
  const [group, setGroup] = useState('tous');
  const [created, setCreated] = useState({});
  const [saved, setSaved] = useState(false);
  const [pct, setPct] = useState(30);
  const [rows, setRows] = useState(KEYWORDS);
  const [selC, setSelC] = useState(KEYWORDS[0].c);
  const selRef = useRef(null);

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const f = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', f); return () => mq.removeEventListener('change', f);
  }, []);
  useEffect(() => {
    if (state !== 'encours') return;
    const t = setInterval(() => setPct(p => (p >= 98 ? 30 : p + 4)), 700); return () => clearInterval(t);
  }, [state]);

  const acct = TOOL_ACCOUNTS.find(a => a.id === acctId) || null;
  useEffect(() => { setDomain(acct ? acct.domain : ''); setSaved(false); }, [acctId]);

  const pickState = s => {
    setState(s); setSaved(false); setCreated({}); setQ(''); setGroup('tous'); setPct(30);
    if (s === 'vide') setRows([]);
    else if (s === 'premier') setRows(KEYWORDS.map(r => ({ ...r, prev: null, isNew: true, history: [r.history[r.history.length - 1]] })));
    else setRows(KEYWORDS);
    setSelC(KEYWORDS[0].c);
    if (s === 'nosel') setAcctId('');
    else if (s === 'prospect') setAcctId('nordik');
    else setAcctId(readLastAcct() || 'acme');
  };
  const pickAcct = id => {
    setAcctId(id); setSaved(false);
    if (id) { writeLastAcct(id); if (state === 'nosel') setState('ok'); } else setState('nosel');
  };
  const create = c => setCreated(m => ({ ...m, [c]: `P-05${String(Object.keys(m).length + 1).padStart(2, '0')}` }));
  const remove = c => { setRows(rs => rs.filter(r => r.c !== c)); if (selC === c) setSelC(null); };
  const add = c => { const nr = { c, group: 'Non classé', intent: 'Transactionnelle', pos: null, prev: null, vol: 0, urls: [], history: [], isNew: true }; setRows(rs => [nr, ...rs]); setSelC(c); };

  const term = q.trim().toLowerCase();
  const filtered = useMemo(() => rows.filter(r => (group === 'tous' || r.group === group) && (!term || r.c.toLowerCase().includes(term))), [rows, group, term]);
  const sel = rows.find(r => r.c === selC) || rows[0] || null;
  const prospect = !!acct && acct.type === 'prospect';
  const premier = state === 'premier';
  const bannerKind = prospect ? 'prospect' : !acct ? 'nosel' : null;
  const dropped = rows.find(r => r.dropped);
  const cannibRow = rows.find(r => r.cannib);
  const nCreated = Object.keys(created).length;
  const canSave = !!acct && state !== 'encours' && state !== 'vide' && rows.length > 0;
  const saveHint = state === 'vide' ? 'Ajoutez au moins un mot-clé au suivi' : state === 'encours' ? 'Relevé en cours' : 'Un relevé est requis';

  return (
    <div className="app-shell">
      <NavSidebar active="outil" activeTool="Position Tracking" />
      <div className="main">
        <div className="crm-header">
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1 }}>Position Tracking</div>
            <div className="crumb"><a href="Dashboard.html">HuntPilote</a><span>›</span><a href="Cadre Outils.html">Outils</a><span>›</span><b>Position Tracking</b>{acct && <><span>›</span><span>{acct.name}</span></>}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl" style={{ marginBottom: 0 }}>Démo · état</span>
            <select className="state-sel" value={state} onChange={e => pickState(e.target.value)} aria-label="État de démonstration">{PT_STATES.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
          </div>
          <button className="btn-icon" title="Notifications"><HI.Bell /></button>
          <button className="btn-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <HI.Sun /> : <HI.Moon />}</button>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MB</div>
        </div>

        <ContextBar acct={acct} onAcct={pickAcct} filter={filter} onFilter={setFilter} domain={domain} onDomain={setDomain}
          period={period} onPeriod={setPeriod} periods={PT_PERIODS} periodLabel="Fenêtre de comparaison"
          costText={`${rows.length} mots-clés suivis`} costTitle="Le nombre de mots-clés suivis détermine le coût mensuel du compte"
          saved={saved} onSave={() => setSaved(true)} canSave={canSave} saveHint={saveHint} selRef={selRef} />

        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          {(bannerKind || (state === 'sorti' && dropped) || (state === 'cannib' && cannibRow) || nCreated > 0) && (
            <div style={{ padding: '0.75rem 1.125rem 0', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {bannerKind && <Banner kind={bannerKind} onFocusAcct={() => selRef.current && selRef.current.focus()} />}
              {state === 'sorti' && dropped && !bannerKind && (
                <div className="banner" data-tone="red">
                  <span className="banner-ico"><AIco.Warn /></span>
                  <div style={{ flex: 1, minWidth: '14rem' }}><b>« {dropped.c} » est sorti du top 100</b> — il était en position {dropped.prev} au relevé précédent. Vérifiez qu’aucune page ciblant cette requête n’a été dépubliée ou bloquée.</div>
                  <div className="banner-act"><button className="btn-out" onClick={() => create(dropped.c)}><AIco.Plus />Créer la priorité</button></div>
                </div>)}
              {state === 'cannib' && cannibRow && !bannerKind && (
                <div className="banner" data-tone="yellow">
                  <span className="banner-ico"><PTI.Fork /></span>
                  <div style={{ flex: 1, minWidth: '14rem' }}><b>Cannibalisation sur « {cannibRow.c} »</b> — {cannibRow.urls.length} pages du site ciblent la même requête ({cannibRow.urls.join(' · ')}). Elles se concurrencent au lieu de se renforcer.</div>
                  <div className="banner-act"><button className="btn-out" onClick={() => create(cannibRow.c)}><AIco.Plus />Créer la priorité</button></div>
                </div>)}
              {nCreated > 0 && <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}><APill label={`${nCreated} priorité${nCreated > 1 ? 's' : ''} créée${nCreated > 1 ? 's' : ''} depuis cet outil`} tone="blue" sm icon={<AIco.Plus />} /><a href="Fiche Client v4.html" style={{ fontSize: '0.625rem', color: 'var(--fg3)' }}>Voir le plan d’action</a></div>}
            </div>)}

          <div className="content">
            <div className="col-main">
              {!acct && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.875rem', fontWeight: 800, marginBottom: 5 }}>Choisissez un compte pour suivre ses mots-clés</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.5, maxWidth: '30rem', margin: '0 auto 11px' }}>Le compte détermine la liste suivie, le domaine pré-rempli et le coût mensuel affiché.</div>
                    <button className="btn-out" onClick={() => selRef.current && selRef.current.focus()}>Choisir un compte</button>
                  </div>
                </div>)}

              {acct && state === 'encours' && (
                <div className="card" style={{ padding: '0.875rem 1rem' }}>
                  <div className="lbl" style={{ marginBottom: 6 }}>Relevé hebdomadaire en cours</div>
                  <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', marginBottom: 7 }}>{Math.round(pct / 100 * rows.length)} sur {rows.length} mots-clés interrogés chez le fournisseur…</div>
                  <div className="track"><div className="fill" style={{ width: `${pct}%`, background: 'var(--blue-fg)' }}></div></div>
                </div>)}

              {acct && state === 'vide' && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.9375rem', fontWeight: 800, marginBottom: 5 }}>Aucun mot-clé suivi pour {acct.name}</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.55, maxWidth: '30rem', margin: '0 auto 14px' }}>Ajoutez les requêtes à suivre chaque semaine. Le coût mensuel du compte dépend du nombre de mots-clés ajoutés.</div>
                  </div>
                  <div className="add-row" style={{ justifyContent: 'center' }}>
                    <input className="inp" placeholder="Ajouter un mot-clé à suivre…" aria-label="Nouveau mot-clé" style={{ width: '16rem' }} onKeyDown={e => { if (e.key === 'Enter' && e.target.value.trim()) { add(e.target.value.trim()); e.target.value = ''; } }} />
                    <button className="btn-go" onClick={() => add('nouveau mot-clé')}><PTI.Plus />Ajouter au suivi</button>
                  </div>
                </div>)}

              {acct && state !== 'encours' && state !== 'vide' && (<>
                <MoversCard rows={rows} premier={premier} />
                <DistributionCard rows={rows} premier={premier} />
                {sel && <TrendCard sel={sel} period={period} />}
                <KeywordTable rows={filtered} allRows={rows} sel={sel} onSel={r => setSelC(r.c)} q={q} onQ={setQ} group={group} onGroup={setGroup}
                  created={created} onCreate={create} onRemove={remove} onAdd={add} />
              </>)}
            </div>
            <div className="col-side">
              <PlanCard n={rows.length} />
              <PtKeepCard prospect={prospect} />
              <SavesCard acct={acct} justSaved={saved} prospect={prospect} items={PT_SAVES} toolName="Position Tracking" savedWhat={`${rows.length} mots-clés · relevé ${period.toLowerCase()}`} />
            </div>
          </div>
        </div>
      </div>
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
