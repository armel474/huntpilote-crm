<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HuntPilote — Backlink Analyse</title>
<script>(function(){var s=null;try{s=localStorage.getItem('hp-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="hp-sidebar.jsx"></script>
<script type="text/babel" src="au-data.jsx"></script>
<script type="text/babel" src="au-panels.jsx"></script>
<script type="text/babel" src="to-panels.jsx"></script>
<script type="text/babel" src="to-results.jsx"></script>
<script type="text/babel" src="bl-data.jsx"></script>
<script type="text/babel" src="bl-panels.jsx"></script>
<link rel="stylesheet" href="hp-shell.css">
<link rel="stylesheet" href="hp-mobile.css">
<link rel="stylesheet" href="au-audit.css">
<link rel="stylesheet" href="to-shell.css">
<link rel="stylesheet" href="bl-audit.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { NavSidebar, AIco, APill, TI, BLI, TOOL_ACCOUNTS, readLastAcct, writeLastAcct, ContextBar, Banner, CostCard, SavesCard, ProfileCard, GainsLossesCard, ToxicCard, CompetitorsCard, BlKeepCard, BL_SCOPES, BL_COSTS, PROFILE, ANCHORS, GAINS, LOSSES, TOXIC, COMPETITORS, BL_SAVES } = window;

const HI = {
  Bell: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg>,
  Sun: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>,
  Moon: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>,
};

const BL_STATES = [['ok', 'Résultats disponibles'], ['aucun', 'Aucun backlink détecté'], ['encours', 'Analyse en cours'], ['perte', 'Perte importante détectée'], ['incomplet', 'Données du fournisseur incomplètes'], ['nosel', 'Aucun compte sélectionné'], ['prospect', 'Prospect · instantané']];

const App = () => {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [state, setState] = useState('ok');
  const [acctId, setAcctId] = useState(() => readLastAcct() || 'acme');
  const [filter, setFilter] = useState('tous');
  const [scope, setScope] = useState(BL_SCOPES[0]);
  const [domain, setDomain] = useState('');
  const [created, setCreated] = useState({});
  const [reported, setReported] = useState({});
  const [toxic, setToxic] = useState(TOXIC);
  const [saved, setSaved] = useState(false);
  const [pct, setPct] = useState(24);
  const selRef = useRef(null);

  useEffect(() => {
    const h = document.documentElement; h.setAttribute('data-theme-switching', ''); h.setAttribute('data-theme', theme);
    try { localStorage.setItem('hp-theme', theme); } catch {}
    const t = setTimeout(() => h.removeAttribute('data-theme-switching'), 500); return () => clearTimeout(t);
  }, [theme]);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const f = e => { let s = null; try { s = localStorage.getItem('hp-theme'); } catch {} if (!s) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', f); return () => mq.removeEventListener('change', f);
  }, []);
  useEffect(() => {
    if (state !== 'encours') return;
    const t = setInterval(() => setPct(p => (p >= 96 ? 24 : p + 6)), 650); return () => clearInterval(t);
  }, [state]);

  const acct = TOOL_ACCOUNTS.find(a => a.id === acctId) || null;
  useEffect(() => { setDomain(acct ? acct.domain : ''); setSaved(false); }, [acctId]);

  const pickState = s => {
    setState(s); setSaved(false); setCreated({}); setReported({}); setToxic(TOXIC); setPct(24);
    if (s === 'nosel') setAcctId('');
    else if (s === 'prospect') setAcctId('nordik');
    else setAcctId(readLastAcct() || 'acme');
  };
  const pickAcct = id => {
    setAcctId(id); setSaved(false);
    if (id) { writeLastAcct(id); if (state === 'nosel') setState('ok'); } else setState('nosel');
  };
  const create = key => setCreated(m => ({ ...m, [key]: `P-05${String(Object.keys(m).length + 1).padStart(2, '0')}` }));
  const report = domain => setReported(m => ({ ...m, [domain]: true }));
  const disavow = domain => setToxic(rs => rs.map(r => r.domain === domain ? { ...r, status: 'desavoue' } : r));

  const prospect = !!acct && acct.type === 'prospect';
  const incomplet = state === 'incomplet';
  const aucun = state === 'aucun';
  const bannerKind = prospect ? 'prospect' : !acct ? 'nosel' : null;
  const cost = BL_COSTS[scope];
  const quota = { used: 8240, max: 10000 };
  const canSave = !!acct && (state === 'ok' || state === 'perte' || state === 'incomplet' || state === 'prospect');
  const nCreated = Object.keys(created).length + Object.keys(reported).length;
  const bigLoss = LOSSES.find(l => l.authority >= 50);

  return (
    <div className="app-shell">
      <NavSidebar active="outil" activeTool="Backlink Analyse" />
      <div className="main">
        <div className="crm-header">
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: '1.0625rem', fontWeight: 800, letterSpacing: '-0.025em', lineHeight: 1 }}>Backlink Analyse</div>
            <div className="crumb"><a href="Dashboard.html">HuntPilote</a><span>›</span><a href="Cadre Outils.html">Outils</a><span>›</span><b>Backlink Analyse</b>{acct && <><span>›</span><span>{acct.name}</span></>}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="lbl" style={{ marginBottom: 0 }}>Démo · état</span>
            <select className="state-sel" value={state} onChange={e => pickState(e.target.value)} aria-label="État de démonstration">{BL_STATES.map(([id, l]) => <option key={id} value={id}>{l}</option>)}</select>
          </div>
          <button className="btn-icon" title="Notifications"><HI.Bell /></button>
          <button className="btn-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title={theme === 'dark' ? 'Mode clair' : 'Mode sombre'}>{theme === 'dark' ? <HI.Sun /> : <HI.Moon />}</button>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--green-m)', color: 'var(--green-fg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.625rem', fontWeight: 700, flexShrink: 0, border: '1.5px solid var(--green-b)' }}>MB</div>
        </div>

        <ContextBar acct={acct} onAcct={pickAcct} filter={filter} onFilter={setFilter} domain={domain} onDomain={setDomain}
          period={scope} onPeriod={setScope} periods={BL_SCOPES} periodLabel="Portée de l’analyse" cost={cost}
          saved={saved} onSave={() => setSaved(true)} canSave={canSave} saveHint="Aucun profil exploitable à enregistrer" selRef={selRef} />

        <div className="sc" style={{ flex: 1, overflowY: 'auto' }}>
          {(bannerKind || state === 'perte' || incomplet || nCreated > 0) && (
            <div style={{ padding: '0.75rem 1.125rem 0', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {bannerKind && <Banner kind={bannerKind} onFocusAcct={() => selRef.current && selRef.current.focus()} />}
              {state === 'perte' && !bannerKind && bigLoss && (
                <div className="banner" data-tone="red">
                  <span className="banner-ico"><AIco.Warn /></span>
                  <div style={{ flex: 1, minWidth: '14rem' }}><b>Perte importante — {bigLoss.domain} (autorité {bigLoss.authority}) a retiré son lien.</b> {LOSSES.length} domaines référents perdus cette période, dont un au-dessus du seuil d’alerte (autorité ≥ 50).</div>
                  <div className="banner-act"><button className="btn-out" onClick={() => create(bigLoss.domain)}><AIco.Plus />Créer la priorité</button></div>
                </div>)}
              {incomplet && !bannerKind && (
                <div className="banner" data-tone="yellow">
                  <span className="banner-ico"><BLI.Domain /></span>
                  <div style={{ flex: 1, minWidth: '14rem' }}><b>Données partielles du fournisseur.</b> Les ancres et la comparaison concurrentielle n’ont pas pu être récupérées pour ce relevé — le reste du profil est fiable.</div>
                  <div className="banner-act"><button className="btn-out" onClick={() => pickState('encours')}><AIco.Refresh />Relancer l’analyse</button></div>
                </div>)}
              {nCreated > 0 && <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}><APill label={`${nCreated} action${nCreated > 1 ? 's' : ''} enregistrée${nCreated > 1 ? 's' : ''} depuis cet outil`} tone="blue" sm icon={<AIco.Plus />} /><a href="Fiche Client v4.html" style={{ fontSize: '0.625rem', color: 'var(--fg3)' }}>Voir le plan d’action</a></div>}
            </div>)}

          <div className="content">
            <div className="col-main">
              {!acct && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.875rem', fontWeight: 800, marginBottom: 5 }}>Choisissez un compte pour analyser son profil</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.5, maxWidth: '30rem', margin: '0 auto 11px' }}>Le compte pré-remplit le domaine et reçoit les gains, pertes et désaveux enregistrés.</div>
                    <button className="btn-out" onClick={() => selRef.current && selRef.current.focus()}>Choisir un compte</button>
                  </div>
                </div>)}

              {acct && state === 'encours' && (
                <div className="card" style={{ padding: '0.875rem 1rem' }}>
                  <div className="lbl" style={{ marginBottom: 6 }}>Analyse du profil en cours</div>
                  <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', marginBottom: 7 }}>Interrogation du fournisseur de données de liens entrants…</div>
                  <div className="track"><div className="fill" style={{ width: `${pct}%`, background: 'var(--blue-fg)' }}></div></div>
                </div>)}

              {acct && aucun && (
                <div className="card" style={{ padding: '1.25rem 1.125rem' }}>
                  <div className="empty" style={{ border: 'none', padding: 0 }}>
                    <div style={{ fontSize: '0.9375rem', fontWeight: 800, marginBottom: 5 }}>Aucun backlink détecté pour {domain || 'ce domaine'}</div>
                    <div style={{ fontSize: '0.6875rem', color: 'var(--fg2)', lineHeight: 1.55, maxWidth: '30rem', margin: '0 auto 12px' }}>Normal pour un site récent ou jamais promu hors de ses propres canaux. Relancez l’analyse après une première campagne de visibilité.</div>
                    <button className="btn-go" onClick={() => pickState('encours')}><AIco.Refresh />Lancer une analyse</button>
                  </div>
                </div>)}

              {acct && !aucun && state !== 'encours' && (<>
                <ProfileCard p={PROFILE} anchors={ANCHORS} incomplet={incomplet} />
                <GainsLossesCard gains={GAINS} losses={LOSSES} reported={reported} onReport={report} onCreate={create} created={created} />
                <ToxicCard rows={toxic} onDisavow={disavow} onCreate={create} created={created} />
                <CompetitorsCard rows={COMPETITORS} incomplet={incomplet} />
              </>)}
            </div>
            <div className="col-side">
              <BlKeepCard prospect={prospect} />
              <CostCard cost={cost} quota={quota} />
              <SavesCard acct={acct} justSaved={saved} prospect={prospect} items={BL_SAVES} toolName="Backlink Analyse" savedWhat={`${PROFILE.domains} domaines référents · profil complet`} />
            </div>
          </div>
        </div>
      </div>
    </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
